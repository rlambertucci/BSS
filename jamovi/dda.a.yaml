name:  DDA
title: "Post Hoc Analysis for MANOVA (DDA)"
menuGroup: BSS
menuSubgroup: Nonparametric ANOVA, Effect sizes & Post-Hocs
menuSubtitle: Descriptive Discriminant Analysis + Effect size
version: '1.0.0'
jas: '1.2'

options:
- name: data
  type: Data

- name: dep
  title: "Grouping Variable"
  type: Variable
  suggested:
    - nominal
  permitted:
    - factor

- name: covs
  title: "Dependent Variables"
  type: Variables
  suggested:
    - continuous
  permitted:
    - numeric

- name: prop
  title: 'Proportion of trace'
  type: Bool
  default: FALSE
  
- name: coef
  title: "Coefficients of linear discriminants"
  type: Bool
  default: TRUE

- name: structCoef
  title: Structure coefficients
  type: Bool
  default: TRUE

- name: gc
  title: 'Group centroids'
  type: Bool
  default: TRUE

- name: classTable
  title: "Classification & cross-validation matrix (LOOCV)"
  type: Bool
  default: FALSE

- name: boxM
  title: "Box's M test for equality of covariance matrices"
  type: Bool
  default: FALSE

- name: plot
  title: 'DDA plot'
  type: Bool
  default: FALSE

- name: showEllipse
  title: "Confidence ellipses"
  type: Bool
  default: TRUE

- name: ellipseLevel
  title: 'Ellipse confidence level'
  type: Number
  default: 0.95
  min: 0.50
  max: 0.99

- name: width
  type: Integer
  title: "DDA plot width"
  default: 500

- name: height
  type: Integer
  title: "DDA plot height"
  default: 500

- name: discScoresOutput
  title: Save discriminant scores
  type: Output

- name: discScores
  title: Discriminant scores
  type: Bool
  default: FALSE

- name: pairwiseES
  title: "Pairwise effect sizes (d & g)"
  type: Bool
  default: FALSE
