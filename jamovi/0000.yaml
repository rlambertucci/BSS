description: >-
  The BSS module provides a comprehensive suite of statistical tools organized 
  according to the main stages of data analysis. It includes: (1) data
  screening, cleaning and presentation tools, such as outlier detection (Dixon’s
  Q Test, IQR, modified Z-score, Mahalanobis & MCD), missing data imputation
  (missRanger and MICE with Rubin rules pooling), and highly customizable group
  comparison plots (bar charts, boxplots, and mean-dispersion graphs) for both
  cross-sectional and longitudinal designs, including automated
  publication-ready descriptive tables (APA, ABNT, Vancouver, and Chicago
  styles, APA HTML export, and correlation matrices). (2) association analyses,
  including correlation comparison (independent, dependent, and Jennrich matrix
  test) and network modeling for continuous and mixed data with bridge
  centrality and community detection; (3) post-analysis tools for result
  interpretation, including pairwise effect size estimation with conversions and
  forest plots, and post hoc analysis for MANOVA using descriptive discriminant
  analysis (DDA) with Box's M test and LOOCV classification; and (4) study
  planning tools, including sample size calculation for finite populations,
  animal experimental designs (Resource Equation Approach), t-test power curves,
  TOST equivalence tests, and proportion tests.
