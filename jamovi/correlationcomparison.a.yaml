---
name: correlationComparison
title: Compare Correlations
menuGroup: BSS
menuSubgroup: Associations & Networks
menuSubtitle: Independent, Dependent and Matrix Equality
version: '0.0.1'
jas: '1.2'
options:
    - name: data
      type: Data

    - name: mode
      title: Analysis Mode
      type: List
      options:
        - name: independent
          title: Independent Correlations (2 Groups - Summary)
        - name: dependent
          title: Dependent Overlapping (r₁₂ vs r₁₃ - Summary)
        - name: dep_nonoverlapping
          title: Dependent Non-Overlapping (r₁₂ vs r₃₄ - Summary)
        - name: multigroup
          title: Multi-Group Homogeneity Test (k ≥ 2 Groups - Raw Data)
        - name: partial_comparison
          title: Partial Correlation Comparison (r_XY.Z between Groups)
        - name: jennrich
          title: Correlation Matrix Equality (Jennrich Test)
      default: independent
    - name: independent_input_type
      title: Data Source (Independent)
      type: List
      options:
        - name: summary
          title: Summary Statistics (r and N)
        - name: raw
          title: Raw Data (Variables & Grouping Factor)
      default: summary

    - name: indep_var_x
      title: Variable X (Raw Data)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: indep_var_y
      title: Variable Y (Raw Data)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: indep_group
      title: Grouping Variable (2 Levels)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: null

    - name: independent_n1
      title: Sample Size (Group 1)
      type: Integer
      default: 20

    - name: independent_n2
      title: Sample Size (Group 2)
      type: Integer
      default: 20

    - name: independent_r1
      title: Correlation Coefficient (Group 1)
      type: Number
      default: 0

    - name: independent_r2
      title: Correlation Coefficient (Group 2)
      type: Number
      default: 0

    - name: dependent_n
      title: Sample Size
      type: Integer
      default: 20

    - name: dependent_r12
      title: Correlation Coefficient (r12 - Var1 vs Var2)
      type: Number
      default: 0

    - name: dependent_r13
      title: Correlation Coefficient (r13 - Var1 vs Var3)
      type: Number
      default: 0

    - name: dependent_r23
      title: Correlation Coefficient (r23 - Var2 vs Var3)
      type: Number
      default: 0

    # Dependent Non-Overlapping Correlations
    - name: dep_non_n
      title: Sample Size (N)
      type: Integer
      default: 50

    - name: dep_non_r12
      title: Correlation r₁₂ (Var 1 vs Var 2)
      type: Number
      default: 0.50

    - name: dep_non_r34
      title: Correlation r₃₄ (Var 3 vs Var 4)
      type: Number
      default: 0.20

    - name: dep_non_r13
      title: Intercorrelation r₁₃ (Var 1 vs Var 3)
      type: Number
      default: 0.30

    - name: dep_non_r14
      title: Intercorrelation r₁₄ (Var 1 vs Var 4)
      type: Number
      default: 0.10

    - name: dep_non_r23
      title: Intercorrelation r₂₃ (Var 2 vs Var 3)
      type: Number
      default: 0.20

    - name: dep_non_r24
      title: Intercorrelation r₂₄ (Var 2 vs Var 4)
      type: Number
      default: 0.30

    # Multi-Group Homogeneity Test (k >= 2)
    - name: multi_var_x
      title: Variable X
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: multi_var_y
      title: Variable Y
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: multi_group
      title: Grouping Variable (k ≥ 2 groups)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: null

    - name: show_ellipse_plot
      title: Show Scatterplot with Confidence Ellipses
      type: Bool
      default: true

    # Partial Correlation Comparison
    - name: partial_var_x
      title: Variable X
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: partial_var_y
      title: Variable Y
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: partial_covs
      title: Control Variables / Covariates (Z)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: partial_group
      title: Grouping Variable (2 groups)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: null

    # Jennrich Matrix Equality Test
    - name: vars_jennrich
      title: Variables
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: group_jennrich
      title: Grouping Variable (2 groups)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: null

    # Forest / Confidence Interval Plot
    - name: show_ci_plot
      title: Show Correlation Confidence Interval Plot
      type: Bool
      default: true
