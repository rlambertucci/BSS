---
name: correlationComparison
title: Compare Correlations
menuGroup: BSS
menuSubgroup: Associations & Networks
menuSubtitle: Independent, Dependent and Matrix Equality
version: '0.0.1'
jas: '1.2'
options:
    - name: data
      type: Data

    - name: mode
      title: "Analysis mode"
      type: List
      options:
        - name: independent
          title: "Independent correlations (2 groups - summary)"
        - name: dependent
          title: "Dependent overlapping (r₁₂ vs r₁₃ - summary)"
        - name: dep_nonoverlapping
          title: "Dependent non-overlapping (r₁₂ vs r₃₄ - summary)"
        - name: multigroup
          title: "Multi-group homogeneity test (k ≥ 2 groups - raw data)"
        - name: partial_comparison
          title: "Partial correlation comparison between groups"
        - name: jennrich
          title: "Correlation matrix equality (Jennrich test)"
      default: independent
    - name: independent_input_type
      title: "Data source (independent)"
      type: List
      options:
        - name: summary
          title: "Summary statistics (r and N)"
        - name: raw
          title: "Raw data (variables & grouping factor)"
      default: summary

    - name: indep_var_x
      title: Variable X (Raw Data)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: indep_var_y
      title: Variable Y (Raw Data)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: indep_group
      title: Grouping Variable (2 Levels)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: null

    - name: independent_n1
      title: "Sample size (group 1)"
      type: Integer
      default: 20

    - name: independent_n2
      title: "Sample size (group 2)"
      type: Integer
      default: 20

    - name: independent_r1
      title: "Correlation coefficient (group 1)"
      type: Number
      default: 0

    - name: independent_r2
      title: "Correlation coefficient (group 2)"
      type: Number
      default: 0

    - name: dependent_n
      title: "Sample size"
      type: Integer
      default: 20

    - name: dependent_r12
      title: "Correlation coefficient (r12 - var1 vs var2)"
      type: Number
      default: 0

    - name: dependent_r13
      title: "Correlation coefficient (r13 - var1 vs var3)"
      type: Number
      default: 0

    - name: dependent_r23
      title: "Correlation coefficient (r23 - var2 vs var3)"
      type: Number
      default: 0

    # Dependent Non-Overlapping Correlations
    - name: dep_non_n
      title: "Sample size (N)"
      type: Integer
      default: 50

    - name: dep_non_r12
      title: "Correlation r₁₂ (var 1 vs var 2)"
      type: Number
      default: 0.50

    - name: dep_non_r34
      title: "Correlation r₃₄ (var 3 vs var 4)"
      type: Number
      default: 0.20

    - name: dep_non_r13
      title: "Intercorrelation r₁₃ (var 1 vs var 3)"
      type: Number
      default: 0.30

    - name: dep_non_r14
      title: "Intercorrelation r₁₄ (var 1 vs var 4)"
      type: Number
      default: 0.10

    - name: dep_non_r23
      title: "Intercorrelation r₂₃ (var 2 vs var 3)"
      type: Number
      default: 0.20

    - name: dep_non_r24
      title: "Intercorrelation r₂₄ (var 2 vs var 4)"
      type: Number
      default: 0.30

    # Multi-Group Homogeneity Test (k >= 2)
    - name: multi_var_x
      title: Variable X
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: multi_var_y
      title: Variable Y
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: multi_group
      title: Grouping Variable (k ≥ 2 groups)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: null

    - name: show_ellipse_plot
      title: "Scatterplot with confidence ellipses"
      type: Bool
      default: true

    # Partial Correlation Comparison
    - name: partial_var_x
      title: Variable X
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: partial_var_y
      title: Variable Y
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: partial_covs
      title: Control Variables / Covariates (Z)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: partial_group
      title: Grouping Variable (2 groups)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: null

    # Jennrich Matrix Equality Test
    - name: vars_jennrich
      title: Variables
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: group_jennrich
      title: Grouping Variable (2 groups)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: null

    # Forest / Confidence Interval Plot
    - name: show_ci_plot
      title: "Correlation confidence interval plot"
      type: Bool
      default: true
