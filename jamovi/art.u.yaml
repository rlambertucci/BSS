---
name: art
title: Aligned Rank Transform (ART)
jus: '3.0'
compilerMode: tame

children:
  - type: ModeSelector
    name: mode
    stretchFactor: 1
    children:

      - type: Content
        name: cross_sectional
        children:
          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: Dependent Variable (DV)
                children:
                  - type: VariablesListBox
                    name: dep_var_cs
                    isTarget: true
                    maxItemCount: 1
              - type: TargetLayoutBox
                label: "Fixed Factors (Categorical IVs)"
                children:
                  - type: VariablesListBox
                    name: fixed_factors_cs
                    isTarget: true

      - type: Content
        name: longitudinal
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: Label
                label: "Use for repeated measures ANOVA or mixed design ANOVA."
              - type: ComboBox
                name: long_format
                label: "Data format"

          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: Dependent Variable (for Long format)
                children:
                  - type: VariablesListBox
                    name: dep_var_long
                    isTarget: true
                    maxItemCount: 1
                    enable: (long_format:long)
              
              - type: TargetLayoutBox
                label: Between-Subject Factors (optional)
                children:
                  - type: VariablesListBox
                    name: fixed_factors_long
                    isTarget: true
              
              - type: TargetLayoutBox
                label: Subject ID Variable (Random Factor)
                children:
                  - type: VariablesListBox
                    name: subject_id_var
                    isTarget: true
                    maxItemCount: 1
              
              - type: TargetLayoutBox
                label: "Within-Subject Factors (Long format - up to 3 factors, e.g. A × B × C)"
                children:
                  - type: VariablesListBox
                    name: within_factors_long
                    isTarget: true
                    enable: (long_format:long)
              
              - type: TargetLayoutBox
                label: "Time / Wave Factor (for Long format)"
                children:
                  - type: VariablesListBox
                    name: time_var
                    isTarget: true
                    maxItemCount: 1
                    enable: (long_format:long)
              
              - type: TargetLayoutBox
                label: "Wave Columns (for Wide format)"
                children:
                  - type: VariablesListBox
                    name: wave_vars
                    isTarget: true
                    enable: (long_format:wide)

  - type: CollapseBox
    label: Post-Hoc & Effect Size
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: run_posthoc
            label: "Pairwise post-hoc tests"
          - type: ComboBox
            name: posthoc_correction
            label: "P-value correction"
            enable: (run_posthoc)
          - type: CheckBox
            name: calc_nonparametric_es
            label: "Nonparametric pairwise effect sizes"
            enable: (run_posthoc)
          - type: CheckBox
            name: calc_es
            label: "Pairwise effect size table"
            enable: (run_posthoc)
          - type: ComboBox
            name: es_method
            label: "Effect size method"
            enable: (run_posthoc && calc_es)

  - type: CollapseBox
    label: Interaction Plot
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: show_plot
            label: "Interaction / marginal means plot"
          - type: TextBox
            name: plot_width
            label: "Plot width"
            format: number
            enable: (show_plot)
          - type: TextBox
            name: plot_height
            label: "Plot height"
            format: number
            enable: (show_plot)

  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: run_analysis
        label: "ART results"
