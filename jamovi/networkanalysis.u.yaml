---
title: Network analysis
name: networkanalysis
jus: '3.0'
compilerMode: tame
children:
  - type: ModeSelector
    name: mode
    stretchFactor: 1
    children:
      - type: Content
        name: continuous
        children:
          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: Variables
                children:
                  - type: VariablesListBox
                    name: vars_net
                    isTarget: true
              - type: TargetLayoutBox
                label: Grouping Variable
                children:
                  - type: VariablesListBox
                    name: groupVar_net
                    maxItemCount: 1
                    isTarget: true
              - type: TargetLayoutBox
                label: Node Groups Variable
                children:
                  - type: VariablesListBox
                    name: nodeGroupVar_net
                    maxItemCount: 1
                    isTarget: true

          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: ComboBox
                name: estimator_net
              - type: ComboBox
                name: corMethod_net

          - type: CollapseBox
            label: Tables
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: CheckBox
                    name: tableCentrality_net
                  - type: CheckBox
                    name: tableBridge_net
                  - type: CheckBox
                    name: tableClustering_net
                  - type: CheckBox
                    name: tableCommunities_net
                  - type: ComboBox
                    name: communityAlgorithm_net
                  - type: CheckBox
                    name: tableWeights_net

          - type: CollapseBox
            label: Plots
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: CheckBox
                    name: plotCentrality_net
                  - type: CheckBox
                    name: plotClustering_net
                  - type: CheckBox
                    name: plotNetwork_net

          - type: CollapseBox
            label: Network Stability (bootnet)
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: CheckBox
                    name: bootStability_net
                  - type: TextBox
                    name: bootN_net
                    label: Bootstrap Samples
                    format: number
                    enable: (bootStability_net)
                  - type: CheckBox
                    name: bootEdgeCI_net
                    enable: (bootStability_net)
                  - type: CheckBox
                    name: bootCS_net
                    enable: (bootStability_net)

          - type: CollapseBox
            label: Network Comparison Test (NCT)
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: CheckBox
                    name: nctTest_net
                    enable: (groupVar_net)
                  - type: TextBox
                    name: nctPermutations_net
                    label: NCT Permutations
                    format: number
                    enable: (nctTest_net)

          - type: CollapseBox
            label: Directed Acyclic Graph (DAG)
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: CheckBox
                    name: dagAnalysis_net
                  - type: ComboBox
                    name: dagAlgorithm_net
                    enable: (dagAnalysis_net)
                  - type: CheckBox
                    name: plotDAG_net
                    enable: (dagAnalysis_net)

          - type: CollapseBox
            label: Network Settings
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: ComboBox
                    name: layoutAlgorithm_net
                  - type: TextBox
                    name: layoutSeed_net
                    label: Layout Random Seed
                    format: number
                  - type: CheckBox
                    name: showLabels_net
                  - type: TextBox
                    name: plotWidth_net
                    label: Network Plot Width
                    format: number
                  - type: TextBox
                    name: plotHeight_net
                    label: Network Plot Height
                    format: number

      - type: Content
        name: mixed
        children:
          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: Continuous Variables (Gaussian)
                children:
                  - type: VariablesListBox
                    name: varsCont_mixed
                    isTarget: true
              - type: TargetLayoutBox
                label: Categorical Variables
                children:
                  - type: VariablesListBox
                    name: varsCat_mixed
                    isTarget: true
              - type: TargetLayoutBox
                label: Count Variables (Poisson)
                children:
                  - type: VariablesListBox
                    name: varsCount_mixed
                    isTarget: true
              - type: TargetLayoutBox
                label: Grouping Variable
                children:
                  - type: VariablesListBox
                    name: groupVar_mixed
                    maxItemCount: 1
                    isTarget: true
              - type: TargetLayoutBox
                label: Node Groups Variable
                children:
                  - type: VariablesListBox
                    name: nodeGroupVar_mixed
                    maxItemCount: 1
                    isTarget: true

          - type: CollapseBox
            label: Estimation Settings
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: ComboBox
                    name: lambdaSelMethod_mixed
                  - type: TextBox
                    name: kFolds_mixed
                    label: Number of Folds (if CV selected)
                    format: number
                  - type: TextBox
                    name: lambdaGam_mixed
                    label: Gamma for EBIC (if EBIC selected)
                    format: number
                  - type: ComboBox
                    name: ruleReg_mixed

          - type: CollapseBox
            label: Tables
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: CheckBox
                    name: tableCentrality_mixed
                  - type: CheckBox
                    name: tableBridge_mixed
                  - type: CheckBox
                    name: tableClustering_mixed
                  - type: CheckBox
                    name: tableCommunities_mixed
                  - type: ComboBox
                    name: communityAlgorithm_mixed
                  - type: CheckBox
                    name: tableWeights_mixed

          - type: CollapseBox
            label: Plots
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: CheckBox
                    name: plotCentrality_mixed
                  - type: CheckBox
                    name: plotClustering_mixed
                  - type: CheckBox
                    name: plotNetwork_mixed

          - type: CollapseBox
            label: Network Settings
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: ComboBox
                    name: layoutAlgorithm_mixed
                  - type: TextBox
                    name: layoutSeed_mixed
                    label: Layout Random Seed
                    format: number
                  - type: CheckBox
                    name: showLabels_mixed
                  - type: TextBox
                    name: plotWidth_mixed
                    label: Network Plot Width
                    format: number
                  - type: TextBox
                    name: plotHeight_mixed
                    label: Network Plot Height
                    format: number
...
