---
name: dataimputation
title: Missing data analysis and imputation
jrs: '1.1'

items:
  - name: imputationInfo_mice_cs
    title: About MICE Cross-sectional Imputation
    type: Html
    visible: (mode == 'mice_cs')

  - name: missingnessTable_mice_cs
    title: Missingness Summary (Cross-sectional)
    type: Table
    visible: (mode == 'mice_cs')
    clearWith:
      - vars_mice_cs
      - predictor_vars_mice_cs
    columns:
      - name: variable
        title: Variable
        type: text
      - name: n_missing
        title: Missing (N)
        type: integer
      - name: pct_missing
        title: Missing (%)
        type: number
        format: dp:1
      - name: n_valid
        title: Valid (N)
        type: integer
      - name: method_used
        title: Method Applied
        type: text

  - name: patternTable_mice_cs
    title: Missing Data Patterns (Cross-sectional)
    type: Table
    visible: (mode == 'mice_cs' && show_pattern_table_mice_cs)
    clearWith:
      - vars_mice_cs
      - predictor_vars_mice_cs
    columns:
      - name: pattern
        title: Pattern
        type: text
      - name: n_cases
        title: Cases (N)
        type: integer
      - name: pct_cases
        title: Cases (%)
        type: number
        format: dp:1
      - name: n_observed
        title: Observed Vars
        type: integer
      - name: missing_vars
        title: Missing Variables
        type: text

  - name: imputedData_mice_cs
    title: Imputed Values (Pooled)
    type: Table
    visible: (mode == 'mice_cs' && run_imputation_mice_cs)
    refs:
      - mice
    clearWith:
      - vars_mice_cs
      - predictor_vars_mice_cs
      - run_imputation_mice_cs
      - imputation_method_mice_cs
      - num_imputations_mice_cs
      - maxiter_mice_cs
      - seed_mice_cs
    columns:
      - name: variable
        title: Variable
        type: text
        combineBelow: true
      - name: original
        title: Original Value
        type: text
      - name: imputed
        title: Pooled Imputed Value
        type: text
      - name: rowNumber
        title: Row
        type: integer

  - name: pooledSummaryTable_mice_cs
    title: Pooled Parameter Estimates (Rubin's Rules)
    type: Table
    visible: (mode == 'mice_cs' && run_imputation_mice_cs && show_pooled_summary_mice_cs)
    refs:
      - Rubin1987
      - mice
    clearWith:
      - vars_mice_cs
      - predictor_vars_mice_cs
      - run_imputation_mice_cs
      - imputation_method_mice_cs
      - num_imputations_mice_cs
      - maxiter_mice_cs
      - seed_mice_cs
    columns:
      - name: variable
        title: Variable
        type: text
      - name: n_obs
        title: Observed (N)
        type: integer
      - name: n_miss
        title: Missing (N)
        type: integer
      - name: mean_obs
        title: Observed Mean
        type: number
        format: dp:3
      - name: sd_obs
        title: Observed SD
        type: number
        format: dp:3
      - name: mean_pooled
        title: Pooled Mean
        type: number
        format: dp:3
      - name: se_pooled
        title: Pooled SE
        type: number
        format: dp:3
      - name: var_within
        title: Within-Var (U)
        type: number
        format: dp:4
      - name: var_between
        title: Between-Var (B)
        type: number
        format: dp:4
      - name: fmi
        title: FMI
        type: number
        format: dp:3
      - name: ci_lower
        title: 95% CI Lower
        type: number
        format: dp:3
      - name: ci_upper
        title: 95% CI Upper
        type: number
        format: dp:3

  - name: upsetPlot_mice_cs
    title: Missing Data UpSet Plot
    type: Image
    width: 700
    height: 500
    renderFun: .renderUpsetPlotMiceCS
    visible: (mode == 'mice_cs' && show_upset_plot_mice_cs)
    requiresData: true
    refs:
      - Lex2014
      - ggplot2
    clearWith:
      - vars_mice_cs
      - predictor_vars_mice_cs

  - name: modelPoolingTable_mice_cs
    title: Pooled Model Estimates (Rubin's Rules)
    type: Table
    visible: (mode == 'mice_cs' && run_imputation_mice_cs && enable_model_pooling_mice_cs)
    refs:
      - Rubin1987
      - BarnardRubin1999
      - mice
    clearWith:
      - vars_mice_cs
      - predictor_vars_mice_cs
      - run_imputation_mice_cs
      - imputation_method_mice_cs
      - num_imputations_mice_cs
      - maxiter_mice_cs
      - seed_mice_cs
      - model_type_mice_cs
      - model_dep_mice_cs
      - model_indep_mice_cs
    columns:
      - name: term
        title: Term
        type: text
      - name: estimate
        title: Estimate (Q)
        type: number
        format: dp:3
      - name: std_error
        title: SE (sqrt(T))
        type: number
        format: dp:3
      - name: statistic
        title: Statistic
        type: number
        format: dp:3
      - name: df
        title: df (adj)
        type: number
        format: dp:2
      - name: p_value
        title: p
        type: number
        format: zto,pvalue
      - name: ci_lower
        title: 95% CI Lower
        type: number
        format: dp:3
      - name: ci_upper
        title: 95% CI Upper
        type: number
        format: dp:3
      - name: rvi
        title: RVI
        type: number
        format: dp:3
      - name: fmi
        title: FMI
        type: number
        format: dp:3

  - name: patternPlot_mice_cs
    title: Missing Data Pattern (md.pattern)
    type: Image
    width: 700
    height: 500
    renderFun: .renderPatternPlotMiceCS
    visible: (mode == 'mice_cs' && show_pattern_plot_mice_cs)
    requiresData: true
    refs:
      - VIM
    clearWith:
      - vars_mice_cs
      - predictor_vars_mice_cs

  - name: correlationPlot_mice_cs
    title: Missingness Correlation Heatmap
    type: Image
    width: 700
    height: 500
    renderFun: .renderCorrelationPlotMiceCS
    visible: (mode == 'mice_cs' && show_correlation_plot_mice_cs)
    requiresData: true
    refs:
      - GGally
    clearWith:
      - vars_mice_cs
      - predictor_vars_mice_cs

  - name: tracePlot_mice_cs
    title: Convergence Trace Plot
    type: Image
    width: 700
    height: 500
    renderFun: .renderTracePlotMiceCS
    visible: (mode == 'mice_cs' && run_imputation_mice_cs && show_trace_plot_mice_cs)
    requiresData: true
    refs:
      - mice
    clearWith:
      - vars_mice_cs
      - predictor_vars_mice_cs
      - run_imputation_mice_cs
      - imputation_method_mice_cs
      - num_imputations_mice_cs
      - maxiter_mice_cs
      - seed_mice_cs

  - name: densityPlot_mice_cs
    title: Observed vs Imputed Distribution
    type: Image
    width: 700
    height: 500
    renderFun: .renderDensityPlotMiceCS
    visible: (mode == 'mice_cs' && run_imputation_mice_cs && show_density_plot_mice_cs)
    requiresData: true
    refs:
      - mice
    clearWith:
      - vars_mice_cs
      - predictor_vars_mice_cs
      - run_imputation_mice_cs
      - imputation_method_mice_cs
      - num_imputations_mice_cs
      - maxiter_mice_cs
      - seed_mice_cs

  - name: stripPlot_mice_cs
    title: Strip Plot by Variable
    type: Image
    width: 700
    height: 500
    renderFun: .renderStripPlotMiceCS
    visible: (mode == 'mice_cs' && run_imputation_mice_cs && show_strip_plot_mice_cs)
    requiresData: true
    refs:
      - mice
    clearWith:
      - vars_mice_cs
      - predictor_vars_mice_cs
      - run_imputation_mice_cs
      - imputation_method_mice_cs
      - num_imputations_mice_cs
      - maxiter_mice_cs
      - seed_mice_cs

  - name: imputedColsOutput_mice_cs
    type: Output
    title: Imputed Variables (MICE Cross-sectional)
    initInRun: true
    clearWith:
      - data
      - vars_mice_cs
      - predictor_vars_mice_cs
      - imputation_method_mice_cs
      - num_imputations_mice_cs
      - maxiter_mice_cs
      - seed_mice_cs
      - run_imputation_mice_cs

