---
name: dataimputation
title: "Missing Data Analysis and Imputation"
jus: '3.0'
compilerMode: tame
events:
  loaded: ./dataimputation::migrateSeeds
  updated: ./dataimputation::migrateSeeds
children:
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    useSingleCell: true
    children:
      - type: ComboBox
        name: mode
        label: Analysis mode
  - type: Label
    label: "Keyboard: select variables, then Tab to a transfer arrow."
  - type: Label
    label: "Use Up/Down between arrows; Enter adds to that destination."
  - type: LayoutBox
    margin: none
    stretchFactor: 1
    useSingleCell: true
    contentLink: (mode:mice_cs)
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Variables to Impute (Cross-sectional)
            children:
              - type: VariablesListBox
                name: vars_mice_cs
                isTarget: true
          - type: TargetLayoutBox
            label: Predictor Variables (optional)
            children:
              - type: VariablesListBox
                name: predictor_vars_mice_cs
                isTarget: true

      - type: CheckBox
        name: run_imputation_mice_cs
        label: "Run Imputation"

      - type: CollapseBox
        label: Imputation Settings
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: ComboBox
                name: imputation_method_mice_cs
                label: "Imputation method"
              - type: TextBox
                name: num_imputations_mice_cs
                label: "Number of imputations (m)"
                format: number
              - type: TextBox
                name: maxiter_mice_cs
                label: "Maximum iterations"
                format: number
              - type: CheckBox
                name: use_seed_mice_cs
                label: Use a fixed seed
              - type: TextBox
                name: seed_mice_cs
                label: Seed
                format: number
                enable: (use_seed_mice_cs)
      - type: CollapseBox
        label: Diagnostic Plots & Summaries
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: CheckBox
                name: show_pattern_plot_mice_cs
              - type: CheckBox
                name: show_upset_plot_mice_cs
              - type: CheckBox
                name: show_pattern_table_mice_cs
              - type: CheckBox
                name: show_correlation_plot_mice_cs
              - type: CheckBox
                name: show_trace_plot_mice_cs
                enable: (run_imputation_mice_cs)
              - type: CheckBox
                name: show_density_plot_mice_cs
                enable: (run_imputation_mice_cs)
              - type: CheckBox
                name: show_strip_plot_mice_cs
                enable: (run_imputation_mice_cs)
              - type: CheckBox
                name: show_pooled_summary_mice_cs
                enable: (run_imputation_mice_cs)

      - type: CollapseBox
        label: Predictive Modeling (Rubin's Rules)
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: CheckBox
                name: enable_model_pooling_mice_cs
                enable: (run_imputation_mice_cs)
              - type: ComboBox
                name: model_type_mice_cs
                enable: (enable_model_pooling_mice_cs)
              - type: VariableSupplier
                name: pooling_variables_mice_cs
                persistentItems: false
                stretchFactor: 1
                children:
                  - type: TargetLayoutBox
                    label: Dependent Variable (Y)
                    children:
                      - type: VariablesListBox
                        name: model_dep_mice_cs
                        enable: (enable_model_pooling_mice_cs)
                        maxItemCount: 1
                        isTarget: true
                  - type: TargetLayoutBox
                    label: Predictors (X)
                    children:
                      - type: VariablesListBox
                        name: model_indep_mice_cs
                        enable: (enable_model_pooling_mice_cs)
                        isTarget: true
      - type: CollapseBox
        label: Save to Worksheet
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: Label
                label: Saves one final imputed dataset directly into new worksheet columns.
              - type: Output
                name: imputedColsOutput_mice_cs

  - type: LayoutBox
    margin: none
    stretchFactor: 1
    useSingleCell: true
    contentLink: (mode:mice_long)
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: data_format_mice_long
            label: "Data format"

      - type: Label
        label: "Wide data: select Wave Columns."
      - type: Label
        label: "Long data: select Variables to Impute and Time / Wave."

      - type: VariableSupplier
        persistentItems: true
        permitted:
          - numeric
          - factor
          - id
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Variables to Impute (long)
            children:
              - type: VariablesListBox
                name: vars_mice_long
                isTarget: true
          - type: TargetLayoutBox
            label: Time / Wave (long)
            children:
              - type: VariablesListBox
                name: time_var_mice_long
                isTarget: true
                maxItemCount: 1
          - type: TargetLayoutBox
            label: Wave Columns (wide)
            children:
              - type: VariablesListBox
                name: wave_vars_mice_long
                isTarget: true
          - type: TargetLayoutBox
            label: Predictor Variables (optional)
            children:
              - type: VariablesListBox
                name: predictor_vars_mice_long
                isTarget: true

          - type: TargetLayoutBox
            label: Subject ID
            children:
              - type: VariablesListBox
                name: subject_id_var_mice_long
                isTarget: true
                maxItemCount: 1

          - type: TargetLayoutBox
            label: Group / Cluster (optional)
            children:
              - type: VariablesListBox
                name: group_var_mice_long
                isTarget: true
                maxItemCount: 1

          - type: TargetLayoutBox
            label: Fixed Covariates (not imputed)
            children:
              - type: VariablesListBox
                name: fixed_covariates_mice_long
                isTarget: true

      - type: CheckBox
        name: run_imputation_mice_long
        label: "Run Imputation"

      - type: CollapseBox
        label: Imputation Settings
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: ComboBox
                name: imputation_method_mice_long
                label: "Imputation method"
              - type: TextBox
                name: num_imputations_mice_long
                label: "Number of imputations (m)"
                format: number
              - type: TextBox
                name: maxiter_mice_long
                label: "Maximum iterations"
                format: number
              - type: CheckBox
                name: use_seed_mice_long
                label: Use a fixed seed
              - type: TextBox
                name: seed_mice_long
                label: Seed
                format: number
                enable: (use_seed_mice_long)
      - type: CollapseBox
        label: Diagnostic Plots & Summaries
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: CheckBox
                name: show_pattern_plot_mice_long
              - type: CheckBox
                name: show_upset_plot_mice_long
              - type: CheckBox
                name: show_pattern_table_mice_long
              - type: CheckBox
                name: show_correlation_plot_mice_long
              - type: CheckBox
                name: show_trace_plot_mice_long
                enable: (run_imputation_mice_long)
              - type: CheckBox
                name: show_density_plot_mice_long
                enable: (run_imputation_mice_long)
              - type: CheckBox
                name: show_strip_plot_mice_long
                enable: (run_imputation_mice_long)
              - type: CheckBox
                name: show_pooled_summary_mice_long
                enable: (run_imputation_mice_long)

      - type: CollapseBox
        label: Predictive Modeling (Rubin's Rules)
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: CheckBox
                name: enable_model_pooling_mice_long
                enable: (run_imputation_mice_long)
              - type: ComboBox
                name: model_type_mice_long
                enable: (enable_model_pooling_mice_long)
              - type: VariableSupplier
                name: pooling_variables_mice_long
                persistentItems: false
                stretchFactor: 1
                children:
                  - type: TargetLayoutBox
                    label: Dependent Variable (Y)
                    children:
                      - type: VariablesListBox
                        name: model_dep_mice_long
                        enable: (enable_model_pooling_mice_long)
                        maxItemCount: 1
                        isTarget: true
                  - type: TargetLayoutBox
                    label: Predictors (X)
                    children:
                      - type: VariablesListBox
                        name: model_indep_mice_long
                        enable: (enable_model_pooling_mice_long)
                        isTarget: true
      - type: CollapseBox
        label: Save to Worksheet
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: Label
                label: Saves one final imputed dataset directly into new worksheet columns.
              - type: Output
                name: imputedColsOutput_mice_long

  - type: LayoutBox
    margin: none
    stretchFactor: 1
    useSingleCell: true
    contentLink: (mode:missranger)
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Variables to Impute
            children:
              - type: VariablesListBox
                name: vars_mr
                isTarget: true
          - type: TargetLayoutBox
            label: Predictor Variables (optional)
            children:
              - type: VariablesListBox
                name: predictor_vars_mr
                isTarget: true

      - type: CheckBox
        name: run_imputation_mr
        label: "Run Imputation"

      - type: CollapseBox
        label: Imputation Settings
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: CheckBox
                name: use_multiple_imputation_mr
              - type: TextBox
                name: num_imputations_mr
                label: "Number of imputations"
                format: number
                enable: (use_multiple_imputation_mr)
              - type: TextBox
                name: maxiter_mr
                label: "Maximum iterations"
                format: number
              - type: TextBox
                name: num_trees_mr
                label: "Number of trees"
                format: number
              - type: TextBox
                name: pmm_k_mr
                label: "Number of donors (PMM)"
                format: number
              - type: CheckBox
                name: use_seed_mr
                label: Use a fixed seed
              - type: TextBox
                name: seed_mr
                label: Seed
                format: number
                enable: (use_seed_mr)
      - type: CollapseBox
        label: Diagnostic Plots & Summaries
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: CheckBox
                name: show_pattern_plot_mr
              - type: CheckBox
                name: show_upset_plot_mr
              - type: CheckBox
                name: show_pattern_table_mr
              - type: CheckBox
                name: show_correlation_plot_mr
              - type: CheckBox
                name: show_density_plot_mr
                enable: (run_imputation_mr)
              - type: CheckBox
                name: show_strip_plot_mr
                enable: (run_imputation_mr)
              - type: CheckBox
                name: show_pooled_summary_mr
                enable: (run_imputation_mr)

      - type: CollapseBox
        label: Predictive Modeling (Rubin's Rules)
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: CheckBox
                name: enable_model_pooling_mr
                enable: (run_imputation_mr && use_multiple_imputation_mr)
              - type: ComboBox
                name: model_type_mr
                enable: (enable_model_pooling_mr)
              - type: VariableSupplier
                name: pooling_variables_mr
                persistentItems: false
                stretchFactor: 1
                children:
                  - type: TargetLayoutBox
                    label: Dependent Variable (Y)
                    children:
                      - type: VariablesListBox
                        name: model_dep_mr
                        enable: (enable_model_pooling_mr)
                        maxItemCount: 1
                        isTarget: true
                  - type: TargetLayoutBox
                    label: Predictors (X)
                    children:
                      - type: VariablesListBox
                        name: model_indep_mr
                        enable: (enable_model_pooling_mr)
                        isTarget: true
      - type: CollapseBox
        label: Save to Worksheet
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: Label
                label: Saves one final imputed dataset directly into new worksheet columns.
              - type: Output
                name: imputedColsOutput_mr
