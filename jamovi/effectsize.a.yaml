name: effectSize
title: Effect Size Calculation
menuGroup: BSS
menuSubgroup: Nonparametric ANOVA, Effect sizes & Post-Hocs
menuSubtitle: Pairwise effect size calculation (independent and dependent samples)
version: '0.0.1'
jas: '1.2'

options:
    - name: data
      type: Data
      title: "Input data"

    - name: mode
      title: "Analysis mode"
      type: List
      options:
        - title: Cross-sectional
          name: cross_sectional
        - title: Longitudinal
          name: longitudinal
      default: cross_sectional

    - name: dep_vars_cs
      title: Dependent Variables (DVs)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: indep_vars_cs
      title: Independent Variables (IVs)
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor
      default: null

    - name: cov
      title: Covariate
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: dep_vars_long
      title: Dependent Variables (DVs - Long format only)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: subject_id_var
      title: Subject ID Variable
      type: Variable
      suggested:
        - nominal
        - id
      permitted:
        - numeric
        - factor
        - id
      default: null

    - name: time_var
      title: Time / Wave Variable (long format)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor
      default: null

    - name: wave_vars
      title: Wave Columns (wide format)
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
        - factor
      default: null

    - name: long_format
      title: "Data format"
      type: List
      options:
        - title: Wide format (one column per wave)
          name: wide
        - title: Long format (time column + value column)
          name: long
      default: wide

    - name: include_interactions
      title: "Interactions between independent variables"
      type: Bool
      default: false

    - name: run_analysis
      title: "Effect size results"
      type: Bool
      default: false

    - name: es_method
      title: "Effect size method"
      type: List
      options:
        - title: Cohen's d
          name: cohens_d
        - title: Hedges' g
          name: hedges_g
        - title: "Glass' delta"
          name: glass_delta
        - title: "Rank biserial correlation"
          name: rank_biserial
        - title: "Algina-Keselman-Penfield robust d (trimmed & winsorized)"
          name: algina_keselman_d
        - title: "Akritas-Arnold relative effect (δ̂)"
          name: akritas_arnold_delta
      default: cohens_d
      
    - name: show_cles
      title: "Common language effect size"
      type: Bool
      default: false

    - name: reference_group
      hidden: true
      title: "Reference group (Glass' delta)"
      type: String
      default: ''

    - name: glass_references
      title: Glass reference levels
      type: Array
      default: []
      template:
        type: Group
        elements:
          - name: variable
            type: Variable
          - name: reference
            type: Level

    - name: es_method_long
      title: "Effect size method (longitudinal)"
      type: List
      options:
        - title: Cohen's dz
          name: cohens_dz
        - title: "Cohen's dav (Morris & DeShon, 2002; Lakens, 2013)"
          name: cohens_dav
        - title: "Cohen's drm (Morris & DeShon, 2002; Lakens, 2013)"
          name: cohens_drm
        - title: Hedges' gz
          name: hedges_gz
        - title: "Glass' delta z"
          name: glass_dz
        - title: "Rank biserial correlation (paired)"
          name: rank_biserial_paired
      default: cohens_dz
      
    - name: show_cles_long
      title: "Common language effect size (paired)"
      type: Bool
      default: false

    - name: reference_group_long
      title: "Reference wave (Glass' delta z)"
      type: String
      default: ''

    - name: use_glm
      title: "GzLM average marginal effect"
      type: Bool
      default: false

    - name: es_glm
      title: "GzLM distribution"
      type: List
      options:
        - title: Gaussian distribution
          name: glm_gaussian
        - title: Gamma distribution
          name: glm_gamma
        - title: Inverse Gaussian distribution
          name: glm_inv_gaussian
      default: glm_gaussian

    - name: ci_method
      title: "Confidence interval method"
      type: List
      options:
        - title: Analytical (formula-based)
          name: analytical
        - title: Bootstrap (non-parametric)
          name: bootstrap
      default: analytical

    - name: n_bootstrap
      title: "Number of bootstrap samples"
      type: Integer
      default: 1000
      min: 100
      max: 10000

    - name: ci_level
      title: "Confidence level"
      type: List
      options:
        - title: 95%
          name: ci_95
        - title: 90%
          name: ci_90
        - title: 99%
          name: ci_99
      default: ci_95

    - name: show_conversions
      title: "Effect size conversions (d, r, η², OR, AUC)"
      type: Bool
      default: false

    - name: benchmark_standard
      title: "Benchmark for qualitative interpretation"
      type: List
      options:
        - title: "Cohen (1988) — small: .2, med: .5, large: .8"
          name: cohen
        - title: "Sawilowsky (2009) — very small: .01, small: .2, med: .5, large: .8, very large: 1.2, huge: 2.0"
          name: sawilowsky
      default: cohen

    - name: show_es_plot
      title: "Effect size forest plot"
      type: Bool
      default: false

    - name: plot_width
      title: "Plot width"
      type: Integer
      default: 650

    - name: plot_height
      title: "Plot height"
      type: Integer
      default: 450

    - name: cat_var1
      title: Categorical Factor 1 (Row / Exposure)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: null

    - name: cat_var2
      title: Categorical Factor 2 (Column / Outcome)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: null

    - name: calc_from_test_stat
      title: "Direct test statistic calculator"
      type: Bool
      default: false

    - name: stat_type
      title: "Test statistic type"
      type: List
      options:
        - title: "t-statistic (t, df)"
          name: stat_t
        - title: "F-statistic (F, df1, df2)"
          name: stat_f
        - title: "z-statistic (z, N)"
          name: stat_z
        - title: "Chi-square (statistic, table dimensions, N)"
          name: stat_chisq
      default: stat_t

    - name: stat_val
      title: "Statistic value"
      type: Number
      default: 2.5

    - name: stat_df1
      title: "Degrees of freedom (numerator for F)"
      type: Number
      default: 30

    - name: stat_df2
      title: "Denominator degrees of freedom (F)"
      type: Number
      default: 60

    - name: stat_rows
      title: "Contingency table rows"
      type: Integer
      default: 2
      min: 2

    - name: stat_cols
      title: "Contingency table columns"
      type: Integer
      default: 2
      min: 2

    - name: stat_n
      title: "Sample size N (z and chi-square)"
      type: Integer
      default: 60
