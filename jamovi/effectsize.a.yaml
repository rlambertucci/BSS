name: effectSize
title: Effect Size Calculation
menuGroup: BSS
menuSubgroup: Nonparametric ANOVA, Effect sizes & Post-Hocs
menuSubtitle: Pairwise effect size calculation (independent and dependent samples)
version: '0.0.1'
jas: '1.2'

options:
    - name: data
      type: Data
      title: Input Data

    - name: mode
      title: Analysis Mode
      type: List
      options:
        - title: Cross-sectional
          name: cross_sectional
        - title: Longitudinal
          name: longitudinal
      default: cross_sectional

    - name: dep_vars_cs
      title: Dependent Variables (DVs)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: indep_vars_cs
      title: Independent Variables (IVs)
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor
      default: null

    - name: cov
      title: Covariate
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: dep_vars_long
      title: Dependent Variables (DVs - Long format only)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: indep_vars_long
      title: Independent Variables (IVs - optional)
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor
      default: null

    - name: cov_long
      title: Covariate
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: subject_id_var
      title: Subject ID Variable
      type: Variable
      suggested:
        - nominal
        - id
      permitted:
        - numeric
        - factor
        - id
      default: null

    - name: time_var
      title: Time / Wave Variable (long format)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor
      default: null

    - name: wave_vars
      title: Wave Columns (wide format)
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
        - factor
      default: null

    - name: long_format
      title: Data Format
      type: List
      options:
        - title: Wide format (one column per wave)
          name: wide
        - title: Long format (time column + value column)
          name: long
      default: wide

    - name: include_interactions
      title: Calculate interactions between IVs
      type: Bool
      default: false

    - name: run_analysis
      title: Run Analysis
      type: Bool
      default: false

    - name: es_method
      title: Effect Size Method
      type: List
      options:
        - title: Cohen's d
          name: cohens_d
        - title: Hedges' g
          name: hedges_g
        - title: Glass' Delta
          name: glass_delta
        - title: Rank Biserial Correlation
          name: rank_biserial
        - title: Algina-Keselman-Penfield Robust d (Trimmed & Winsorized)
          name: algina_keselman_d
        - title: Akritas-Arnold Relative Effect (δ̂)
          name: akritas_arnold_delta
      default: cohens_d
      
    - name: show_cles
      title: Calculate CLES (Common Language Effect Size)
      type: Bool
      default: false

    - name: reference_group
      title: Reference Group (Glass' Delta)
      type: String
      default: ''

    - name: es_method_long
      title: Effect Size Method (Longitudinal)
      type: List
      options:
        - title: Cohen's dz
          name: cohens_dz
        - title: "Cohen's dav (Morris & DeShon, 2002; Lakens, 2013)"
          name: cohens_dav
        - title: "Cohen's drm (Morris & DeShon, 2002; Lakens, 2013)"
          name: cohens_drm
        - title: Hedges' gz
          name: hedges_gz
        - title: Glass' Delta z
          name: glass_dz
        - title: Rank Biserial Correlation (paired)
          name: rank_biserial_paired
      default: cohens_dz
      
    - name: show_cles_long
      title: Calculate CLES (paired)
      type: Bool
      default: false

    - name: reference_group_long
      title: Reference Wave (Glass' Delta z)
      type: String
      default: ''

    - name: use_glm
      title: Use GzLM — Average Marginal Effect (AME)
      type: Bool
      default: false

    - name: es_glm
      title: GzLM Distribution
      type: List
      options:
        - title: Gaussian distribution
          name: glm_gaussian
        - title: Gamma distribution
          name: glm_gamma
        - title: Inverse Gaussian distribution
          name: glm_inv_gaussian
      default: glm_gaussian

    - name: ci_method
      title: Confidence Interval Method
      type: List
      options:
        - title: Analytical (formula-based)
          name: analytical
        - title: Bootstrap (non-parametric)
          name: bootstrap
      default: analytical

    - name: n_bootstrap
      title: Number of Bootstrap Samples
      type: Integer
      default: 1000
      min: 100
      max: 10000

    - name: ci_level
      title: Confidence Level
      type: List
      options:
        - title: 95%
          name: ci_95
        - title: 90%
          name: ci_90
        - title: 99%
          name: ci_99
      default: ci_95

    - name: show_conversions
      title: 'Show Effect Size Conversions (d, r, η², OR, AUC)'
      type: Bool
      default: false

    - name: benchmark_standard
      title: 'Benchmark for Qualitative Interpretation'
      type: List
      options:
        - title: "Cohen (1988) — Small: .2, Med: .5, Large: .8"
          name: cohen
        - title: "Sawilowsky (2009) — Very Small: .01, Small: .2, Med: .5, Large: .8, Very Large: 1.2, Huge: 2.0"
          name: sawilowsky
      default: cohen

    - name: show_es_plot
      title: 'Effect Size Forest Plot'
      type: Bool
      default: false

    - name: plot_width
      title: 'Plot Width'
      type: Integer
      default: 650

    - name: plot_height
      title: 'Plot Height'
      type: Integer
      default: 450

    - name: show_categorical_es
      title: Categorical Effect Sizes (Cramér's V, Odds Ratio, Relative Risk, Cohen's h)
      type: Bool
      default: false

    - name: cat_var1
      title: Categorical Factor 1 (Row / Exposure)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: null

    - name: cat_var2
      title: Categorical Factor 2 (Column / Outcome)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: null

    - name: calc_from_test_stat
      title: Direct Test Statistic Calculator (t, F, z, χ²)
      type: Bool
      default: false

    - name: stat_type
      title: Test Statistic Type
      type: List
      options:
        - title: "t-statistic (t, df)"
          name: stat_t
        - title: "F-statistic (F, df1, df2)"
          name: stat_f
        - title: "z-statistic (z, N)"
          name: stat_z
        - title: "Chi-Square (χ², df, N)"
          name: stat_chisq
      default: stat_t

    - name: stat_val
      title: Statistic Value
      type: Number
      default: 2.5

    - name: stat_df1
      title: Degrees of Freedom 1 (df or df1)
      type: Number
      default: 30

    - name: stat_df2
      title: Degrees of Freedom 2 (df2 - for F)
      type: Number
      default: 60

    - name: stat_n
      title: Sample Size N (optional)
      type: Integer
      default: 60
