name: dataTransform
title: Data Transformation
jus: '3.0'
compilerMode: tame
children:
  - type: VariableSupplier
    name: variablesupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables to Transform
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true

  - type: CollapseBox
    label: Transformation Settings
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: ComboBox
            name: method
            label: "Transformation method"
          - type: ComboBox
            name: bounded_scale
            label: "Input scale for arcsine and logit"
          - type: ComboBox
            name: int_formula
            label: "Rank-based formula"
            enable: (method:int)
          - type: CheckBox
            name: auto_shift
            label: "Automatic shift for non-positive values"
            enable: (method:boxcox)
          - type: Label
            label: >
              Adds a constant to make all values positive before transformation (required for Box-Cox)
            enable: (method:boxcox)
          - type: CheckBox
            name: show_lambda_table
            label: "Lambda (λ) summary table"

  - type: CollapseBox
    label: Normality & Diagnostics
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: CheckBox
            name: show_normality_table
            label: "Normality test (before & after transformation)"
          - type: ComboBox
            name: normality_test
            label: "Normality test method"
            enable: (show_normality_table)
          - type: TextBox
            name: alpha_sw
            label: "Significance level (α)"
            format: number
            enable: (show_normality_table)
          - type: CheckBox
            name: show_recommendation_table
            label: "Transformation recommender & ranking (minimizing skewness & kurtosis)"
          - type: CheckBox
            name: show_qq_plot
            label: "Q-q plot (before & after transformation)"
          - type: CheckBox
            name: show_hist_plot
            label: Histogram (before & after transformation)
          - type: CheckBox
            name: show_density_plot
            label: "Density plot (before & after transformation)"

  - type: CollapseBox
    label: Save
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: TextBox
            name: suffix
            label: "Suffix for transformed variable name"
            format: string
          - type: Label
            label: >
              Saves one transformed column per variable using the specified suffix (e.g., weight_transformed).
          - type: Output
            name: transformedVarsOutput
