---
name: correlationComparison
title: Comparison of Correlations
jrs: '1.1'
items:
    - name: comparisonInfo
      title: Comparison Types
      type: Html
      visible: True

    - name: comparisonTable
      title: Correlation Comparison Results
      type: Table
      rows: 1
      visible: (mode != 'jennrich' && mode != 'multigroup' && mode != 'partial_comparison')
      clearWith:
        - mode
        - independent_n1
        - independent_n2
        - independent_r1
        - independent_r2
        - dependent_n
        - dependent_r12
        - dependent_r13
        - dependent_r23
        - dep_non_n
        - dep_non_r12
        - dep_non_r34
        - dep_non_r13
        - dep_non_r14
        - dep_non_r23
        - dep_non_r24
      columns:
          - name: comparisonType
            title: Type
            type: text
          - name: n_group1
            title: N (Group 1)
            type: integer
            visible: (mode:independent)
          - name: n_group2
            title: N (Group 2)
            type: integer
            visible: (mode:independent)
          - name: r_group1
            title: r (Group 1)
            type: number
            format: zto
            visible: (mode:independent)
          - name: r_group2
            title: r (Group 2)
            type: number
            format: zto
            visible: (mode:independent)
          - name: n_dep
            title: N
            type: integer
            visible: (mode:dependent || mode:dep_nonoverlapping)
          - name: r12_dep
            title: r₁₂
            type: number
            format: zto
            visible: (mode:dependent || mode:dep_nonoverlapping)
          - name: r13_dep
            title: r₁₃
            type: number
            format: zto
            visible: (mode:dependent)
          - name: r23_dep
            title: r₂₃
            type: number
            format: zto
            visible: (mode:dependent)
          - name: r34_dep
            title: r₃₄
            type: number
            format: zto
            visible: (mode:dep_nonoverlapping)
          - name: statistic
            title: Statistic
            type: number
            format: zto
          - name: p_value
            title: p
            type: number
            format: zto,pvalue

    - name: multiGroupTable
      title: Multi-Group Correlation Estimates (k ≥ 2)
      type: Table
      visible: (mode == 'multigroup')
      refs:
        - Cochran1954
      clearWith:
        - mode
        - multi_var_x
        - multi_var_y
        - multi_group
      columns:
          - name: group
            title: Group
            type: text
          - name: n
            title: N
            type: integer
          - name: r
            title: r
            type: number
            format: zto
          - name: z
            title: Fisher's z
            type: number
            format: dp:3
          - name: ci_lower
            title: 95% CI Lower
            type: number
            format: zto
          - name: ci_upper
            title: 95% CI Upper
            type: number
            format: zto

    - name: multiGroupOverallTable
      title: Multi-Group Homogeneity Test (Fisher's Q / χ²)
      type: Table
      rows: 1
      visible: (mode == 'multigroup')
      refs:
        - Cochran1954
      clearWith:
        - mode
        - multi_var_x
        - multi_var_y
        - multi_group
      columns:
          - name: k_groups
            title: Groups (k)
            type: integer
          - name: pooled_r
            title: Weighted Mean r
            type: number
            format: zto
          - name: q_stat
            title: Cochran's Q (χ²)
            type: number
            format: dp:3
          - name: df
            title: df
            type: integer
          - name: p_value
            title: p
            type: number
            format: zto,pvalue

    - name: partialTable
      title: Partial Correlation Comparison (r_XY.Z between Groups)
      type: Table
      rows: 1
      visible: (mode == 'partial_comparison')
      refs:
        - Steiger1980
      clearWith:
        - mode
        - partial_var_x
        - partial_var_y
        - partial_covs
        - partial_group
      columns:
          - name: group1
            title: Group 1
            type: text
          - name: group2
            title: Group 2
            type: text
          - name: n1
            title: N₁
            type: integer
          - name: n2
            title: N₂
            type: integer
          - name: r_partial_g1
            title: r_XY.Z (G1)
            type: number
            format: zto
          - name: r_partial_g2
            title: r_XY.Z (G2)
            type: number
            format: zto
          - name: z_stat
            title: z
            type: number
            format: dp:3
          - name: p_value
            title: p
            type: number
            format: zto,pvalue

    - name: ciPlot
      title: Correlation Confidence Intervals (95% CI)
      type: Image
      width: 550
      height: 350
      renderFun: .renderCIPlot
      visible: (mode != 'jennrich' && mode != 'multigroup' && mode != 'partial_comparison' && show_ci_plot)
      refs:
        - ggplot2
      clearWith:
        - mode
        - independent_n1
        - independent_n2
        - independent_r1
        - independent_r2
        - dependent_n
        - dependent_r12
        - dependent_r13
        - dependent_r23
        - dep_non_n
        - dep_non_r12
        - dep_non_r34
        - dep_non_r13
        - dep_non_r14
        - dep_non_r23
        - dep_non_r24
        - show_ci_plot

    - name: ellipsePlot
      title: Bivariate Scatterplot with Overlapping Confidence Ellipses
      type: Image
      width: 600
      height: 450
      renderFun: .renderEllipsePlot
      visible: ((mode == 'multigroup' || mode == 'partial_comparison') && show_ellipse_plot)
      refs:
        - ggplot2
      clearWith:
        - mode
        - multi_var_x
        - multi_var_y
        - multi_group
        - partial_var_x
        - partial_var_y
        - partial_covs
        - partial_group
        - show_ellipse_plot

    - name: jennrichTable
      title: Jennrich Correlation Matrix Equality Test
      type: Table
      rows: 1
      visible: (mode == 'jennrich')
      refs:
        - Jennrich1970
      clearWith:
        - mode
        - vars_jennrich
        - group_jennrich
      columns:
          - name: group1
            title: Group 1
            type: text
          - name: group2
            title: Group 2
            type: text
          - name: n1
            title: N₁
            type: integer
          - name: n2
            title: N₂
            type: integer
          - name: numVars
            title: Variables (p)
            type: integer
          - name: chisq
            title: "χ² Statistic"
            type: number
            format: dp:3
          - name: df
            title: df
            type: integer
          - name: p_value
            title: p
            type: number
            format: zto,pvalue
