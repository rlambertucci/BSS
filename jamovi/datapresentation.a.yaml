name: DataPresentation
title: Data Presentation
menuGroup: BSS
menuSubgroup: Study Design & Presentation
menuSubtitle: Plots and Table (cross-sectional and longitudinal studies)
version: '1.2.0'
jas: '1.2'

options:
    - name: data
      type: Data
      title: "Input data"
    - name: analysisType
      title: "Analysis design"
      type: List
      options:
        - name: cross_sectional
          title: "Independent groups"
        - name: longitudinal
          title: "Repeated measures"
      default: cross_sectional
    - name: deps
      title: Dependent Variables
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric

    - name: group
      title: Grouping Variables (Cross-Sectional)
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
    - name: rm_vars
      title: Repeated Measures Variables (Wide Format)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric

    - name: group_long
      title: Between-Subjects Factor(s)
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: cov
      title: Covariate
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric

    - name: cov_long
      title: Covariate
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
    - name: plotType
      title: "Plot type"
      type: List
      options:
        - name: bar
          title: "Bar chart"
        - name: boxplot
          title: "Box plot"
        - name: meandp
          title: "Mean & dispersion"
        - name: density
          title: "Density distribution (empirical)"
      default: bar

    - name: theo_dist
      title: "Theoretical distribution curve"
      type: List
      hidden: true
      options:
        - name: none
          title: "None (empirical only)"
        - name: normal
          title: "Normal distribution"
        - name: gamma
          title: "Gamma distribution (> 0)"
        - name: inv_gaussian
          title: "Inverse Gaussian distribution (> 0)"
      default: none

    - name: intStyle
      title: "Interaction style"
      type: List
      options:
        - name: legend
          title: "1St on x-axis, 2nd as legend"
        - name: x_axis
          title: "Combined labels on x-axis"
      default: legend

    - name: showLines
      title: "Connect means with line (longitudinal)"
      type: Bool
      default: true

    - name: errorType
      title: "Dispersion measure"
      type: List
      options:
        - name: sd
          title: "Standard deviation (SD)"
        - name: se
          title: "Standard error (SE)"
        - name: ci
          title: "Confidence interval (CI)"
      default: sd

    - name: ciWidth
      title: "Confidence interval width (%)"
      type: Number
      min: 50
      max: 99.9
      default: 95

    - name: showPoints
      title: "Individual data points"
      type: Bool
      default: false
    - name: showTable
      title: "Descriptive table"
      type: Bool
      default: true

    - name: tableFormat
      title: "Table format"
      type: List
      options:
        - name: apa
          title: APA (7th edition)
        - name: abnt
          title: ABNT (NBR 14724)
        - name: vancouver
          title: Vancouver
        - name: chicago
          title: Chicago
      default: apa

    - name: colorPalette
      title: "Color palette"
      type: List
      options:
        - name: set1
          title: Set 1 (qualitative)
        - name: set2
          title: Set 2 (qualitative)
        - name: set3
          title: Set 3 (qualitative)
        - name: pastel1
          title: Pastel 1
        - name: pastel2
          title: Pastel 2
        - name: grayscale
          title: Grayscale
        - name: viridis
          title: Viridis
        - name: plasma
          title: Plasma
        - name: manual
          title: Manual (use fields below)
      default: set1

    - name: color1
      title: Color 1
      type: List
      options: &colorOptions
        - name: none
          title: "None (use palette)"
        - name: '#E41A1C'
          title: Red
        - name: '#377EB8'
          title: Blue
        - name: '#4DAF4A'
          title: Green
        - name: '#984EA3'
          title: Purple
        - name: '#FF7F00'
          title: Orange
        - name: '#FFFF33'
          title: Yellow
        - name: '#A65628'
          title: Brown
        - name: '#F781BF'
          title: Pink
        - name: '#999999'
          title: Gray
        - name: '#000000'
          title: Black
        - name: '#FFFFFF'
          title: White
        - name: '#1B9E77'
          title: Teal
        - name: '#D95F02'
          title: "Dark orange"
        - name: '#7570B3'
          title: "Slate blue"
        - name: '#E7298A'
          title: Magenta
        - name: '#66A61E'
          title: "Lime green"
        - name: '#E6AB02'
          title: Gold
        - name: '#A6761D'
          title: Bronze
        - name: '#666666'
          title: "Dark gray"
      default: none

    - name: color2
      title: Color 2
      type: List
      options: *colorOptions
      default: none

    - name: color3
      title: Color 3
      type: List
      options: *colorOptions
      default: none

    - name: color4
      title: Color 4
      type: List
      options: *colorOptions
      default: none

    - name: color5
      title: Color 5
      type: List
      options: *colorOptions
      default: none

    - name: color6
      title: Color 6
      type: List
      options: *colorOptions
      default: none

    - name: color7
      title: Color 7
      type: List
      options: *colorOptions
      default: none

    - name: color8
      title: Color 8
      type: List
      options: *colorOptions
      default: none
    - name: titleText
      title: "Plot title"
      type: String
      default: ''

    - name: subtitleText
      title: "Plot subtitle"
      type: String
      default: ''

    - name: xLabel
      title: "X axis label"
      type: String
      default: ''

    - name: yLabel
      title: "Y axis label"
      type: String
      default: ''
    - name: xAngle
      title: "X axis label angle"
      type: Number
      min: 0
      max: 90
      default: 0

    - name: legendPosition
      title: "Legend position"
      type: List
      options:
        - name: right
          title: Right
        - name: left
          title: Left
        - name: top
          title: Top
        - name: bottom
          title: Bottom
        - name: none
          title: None (hide)
      default: right

    - name: removeGap
      title: "Remove y-axis bottom gap"
      type: Bool
      default: false

    - name: customYAxis
      title: "Custom y-axis scale"
      type: Bool
      default: false

    - name: yMin
      title: "Y minimum"
      type: Number
      default: 0

    - name: yMax
      title: "Y maximum"
      type: Number
      default: 100

    - name: yStep
      title: "Y step (breaks)"
      type: Number
      default: 10
    - name: fontSizeTitle
      title: "Title font size"
      type: Number
      min: 6
      max: 32
      default: 14

    - name: fontSizeSubtitle
      title: "Subtitle font size"
      type: Number
      min: 6
      max: 32
      default: 12

    - name: fontSizeAxis
      title: "Axis text font size"
      type: Number
      min: 6
      max: 32
      default: 11

    - name: fontSizeAxisTitle
      title: "Axis title font size"
      type: Number
      min: 6
      max: 32
      default: 12

    - name: fontSizeLegend
      title: "Legend font size"
      type: Number
      min: 6
      max: 32
      default: 10
    - name: lineWidth
      title: "Border width"
      type: Number
      min: 0
      max: 5
      default: 0.8

    - name: errorLineWidth
      title: "Error bar width"
      type: Number
      min: 0
      max: 5
      default: 0.8

    - name: axisLineWidth
      title: "Axis line width"
      type: Number
      min: 0
      max: 5
      default: 0.8
    - name: barWidth
      title: "Bar width"
      type: Number
      min: 0.1
      max: 1.0
      default: 0.7

    - name: barAlpha
      title: "Bar transparency"
      type: Number
      min: 0
      max: 1
      default: 1.0

    - name: pointSize
      title: "Point size"
      type: Number
      min: 0.5
      max: 10
      default: 2.0

    - name: pointAlpha
      title: "Point transparency"
      type: Number
      min: 0
      max: 1
      default: 0.5

    - name: showCorrMatrix
      title: "Correlation matrix with significance stars"
      type: Bool
      default: false

    - name: corrMethod
      title: "Correlation method"
      type: List
      options:
        - name: pearson
          title: Pearson (r)
        - name: spearman
          title: Spearman (rho)
      default: pearson

    - name: showCorrHeatmap
      title: "Correlation heatmap"
      type: Bool
      default: false

    - name: corrCluster
      title: "Hierarchical clustering in heatmap"
      type: Bool
      default: false

    - name: summary_distribution
      title: "Distribution"
      type: List
      options:
        - name: normal
          title: "Normal"
        - name: gamma
          title: "Gamma (> 0)"
        - name: inv_gaussian
          title: "Inverse Gaussian (> 0)"
      default: normal
