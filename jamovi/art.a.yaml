name: art
title: Aligned Rank Transform (ART)
menuGroup: BSS
menuSubgroup: Nonparametric ANOVA, Effect sizes & Post-Hocs
menuSubtitle: Nonparametric Factorial and Mixed ANOVAs
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data
      title: "Input data"

    - name: mode
      title: "Analysis mode"
      type: List
      options:
        - title: "Cross-sectional (independent)"
          name: cross_sectional
        - title: "Longitudinal (repeated/mixed)"
          name: longitudinal
      default: cross_sectional

    - name: dep_var_cs
      title: Dependent Variable (DV)
      type: Variable
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      default: null

    - name: fixed_factors_cs
      title: Fixed Factors (Categorical IVs)
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: null

    - name: long_format
      title: "Data format"
      type: List
      options:
        - title: Wide format (one column per wave)
          name: wide
        - title: Long format (time column + value column)
          name: long
      default: wide

    - name: dep_var_long
      title: Dependent Variable (DV - Long format only)
      type: Variable
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      default: null

    - name: fixed_factors_long
      title: Between-Subject Factors (optional)
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: null

    - name: subject_id_var
      title: Subject ID Variable
      type: Variable
      suggested:
        - nominal
        - id
      permitted:
        - factor
        - numeric
        - id
      default: null

    - name: time_var
      title: Time / Wave Factor (Long format)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: null

    - name: within_factors_long
      title: Within-Subject Factors (Long format - up to 3 factors, e.g. A × B × C)
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: null

    - name: wave_vars
      title: Wave Columns (Wide format)
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      default: null

    - name: run_posthoc
      title: "Pairwise post-hoc tests"
      type: Bool
      default: false

    - name: posthoc_correction
      title: "P-value correction (post-hoc)"
      type: List
      options:
        - title: "Holm (sequential Bonferroni)"
          name: holm
        - title: Bonferroni
          name: bonferroni
        - title: Tukey
          name: tukey
        - title: FDR / Benjamini-Hochberg
          name: fdr
        - title: None
          name: none
      default: holm

    - name: calc_es
      title: "Pairwise effect size table"
      type: Bool
      default: false

    - name: es_method
      title: "Effect size method"
      type: List
      options:
        - title: Cohen's d (from z/t-ratios)
          name: cohens_d
        - title: Hedges' g
          name: hedges_g
        - title: Vargha & Delaney's A
          name: vargha_delaney_a
        - title: "Rank-biserial correlation"
          name: rank_biserial
        - title: "All effect sizes"
          name: all
      default: cohens_d

    - name: calc_nonparametric_es
      title: "Nonparametric pairwise effect sizes"
      type: Bool
      default: false

    - name: show_plot
      title: "Interaction / marginal means plot"
      type: Bool
      default: false

    - name: plot_width
      title: "Plot width"
      type: Integer
      default: 600

    - name: plot_height
      title: "Plot height"
      type: Integer
      default: 450

    - name: run_analysis
      title: "ART results"
      type: Bool
      default: false
