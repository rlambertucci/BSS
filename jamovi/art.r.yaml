name: art
title: Aligned Rank Transform (ART)
jrs: '1.1'
items:
    - name: analysisInfo
      title: About ART Analysis
      type: Html
      visible: true

    - name: anovaTable
      title: Nonparametric ANOVA Results (Aligned Rank Transform)
      type: Table
      visible: (run_analysis)
      refs:
        - ARTool
        - Wobbrock2011
        - effectsize
      clearWith:
        - mode
        - dep_var_cs
        - fixed_factors_cs
        - dep_var_long
        - fixed_factors_long
        - within_factors_long
        - long_format
        - subject_id_var
        - time_var
        - wave_vars
        - run_analysis
      columns:
        - name: factor
          title: Term
          type: text
        - name: df
          title: df
          type: number
        - name: df_res
          title: "Residual df"
          type: number
        - name: f_value
          title: F
          type: number
        - name: p_value
          title: p
          type: number
          format: pvalue
        - name: part_eta_sq
          title: Partial η²
          type: number
        - name: part_omega_sq
          title: Partial ω² (F-based approx.)
          type: number
        - name: eps_sq
          title: Partial ε²
          type: number

    - name: posthocTable
      title: "Pairwise Post-Hoc Tests"
      type: Table
      visible: (run_analysis && run_posthoc)
      refs:
        - ARTool
        - Elkin2021
        - emmeans
        - Benjamini1995
        - VarghaDelaney2000
        - Kerby2014
      clearWith:
        - mode
        - dep_var_cs
        - fixed_factors_cs
        - dep_var_long
        - fixed_factors_long
        - within_factors_long
        - long_format
        - subject_id_var
        - time_var
        - wave_vars
        - run_posthoc
        - posthoc_correction
        - calc_nonparametric_es
        - run_analysis
      columns:
        - name: factor
          title: Factor / Interaction
          type: text
          combineBelow: true
        - name: contrast
          title: Contrast
          type: text
        - name: estimate
          title: Estimate
          type: number
        - name: se
          title: SE
          type: number
        - name: df
          title: df
          type: number
        - name: t_ratio
          title: t
          type: number
        - name: p_value
          title: p
          type: number
          format: pvalue
        - name: vd_a
          title: A (Vargha-Delaney)
          type: number
          visible: (calc_nonparametric_es)
        - name: r_rb
          title: "Rank-biserial correlation"
          type: number
          visible: (calc_nonparametric_es)

    - name: effectSizeTable
      title: Pairwise Effect Sizes
      type: Table
      visible: (run_analysis && run_posthoc && calc_es)
      refs:
        - ARTool
        - emmeans
        - VarghaDelaney2000
        - Kerby2014
      clearWith:
        - mode
        - dep_var_cs
        - fixed_factors_cs
        - dep_var_long
        - fixed_factors_long
        - within_factors_long
        - long_format
        - subject_id_var
        - time_var
        - wave_vars
        - run_posthoc
        - calc_es
        - es_method
        - run_analysis
      columns:
        - name: factor
          title: Factor / Interaction
          type: text
          combineBelow: true
        - name: contrast
          title: Contrast
          type: text
        - name: method
          title: Method
          type: text
        - name: es_value
          title: Effect Size
          type: number

    - name: artPlot
      title: Interaction & Marginal Means Plot
      type: Image
      width: 600
      height: 450
      renderFun: .renderArtPlot
      visible: (run_analysis && show_plot)
      requiresData: false
      clearWith:
        - mode
        - dep_var_cs
        - fixed_factors_cs
        - dep_var_long
        - fixed_factors_long
        - within_factors_long
        - long_format
        - subject_id_var
        - time_var
        - wave_vars
        - run_analysis
        - plot_width
        - plot_height

    - name: text
      title: Analysis Summary
      type: Preformatted
      visible: false
      clearWith:
        - mode
        - dep_var_cs
        - fixed_factors_cs
        - dep_var_long
        - fixed_factors_long
        - within_factors_long
        - long_format
        - subject_id_var
        - time_var
        - wave_vars
