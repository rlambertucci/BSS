---
name: DDA
title: Descriptive Discriminant Analysis
jrs: '1.1'
items:
    - name: ddaInfo
      title: About Descriptive Discriminant Analysis
      type: Html
      visible: True

    - name: prop
      title: Proportion of trace
      type: Table
      visible: (prop)
      rows: 1
      clearWith:
        - covs
        - dep
      columns:
        - name: name
          title: ''
          type: text
          content: Proportion(%)

    - name: coef
      title: Coefficients of linear discriminants
      type: Table
      refs: MASS
      visible: (coef)
      clearWith:
        - covs
        - dep
      columns:
        - name: name
          title: ''
          type: text
          content: ($key)

    - name: structCoefTable
      title: Structure Coefficients
      type: Table
      visible: (structCoef)
      refs:
        - MASS
      clearWith:
        - covs
        - dep
      columns:
        - name: varName
          title: ''
          type: text

    - name: gc
      title: Group Centroids
      type: Table
      refs: MASS
      visible: (gc)
      clearWith:
        - covs
        - dep
      columns:
        - name: name
          title: Groups
          type: text
          content: ($key)

    - name: boxMTable
      title: "Box's M Test for Homogeneity of Covariance"
      type: Table
      refs:
        - Box1949
      visible: (boxM)
      clearWith:
        - covs
        - dep
      columns:
        - name: stat
          title: "Box's M"
          type: number
          format: dp:3
        - name: chi
          title: "Chi-Square"
          type: number
          format: dp:3
        - name: df
          title: "df"
          type: integer
        - name: p
          title: "p"
          type: number
          format: zto,pvalue

    - name: classTable
      title: Classification & Cross-Validation Matrix
      type: Table
      refs:
        - MASS
        - Fisher1936
      visible: (classTable)
      clearWith:
        - covs
        - dep
      columns:
        - name: method
          title: Method
          type: text
          combineBelow: true
        - name: actualGroup
          title: Actual Group
          type: text
        - name: total
          title: Total (N)
          type: integer
        - name: pctCorrect
          title: Correct (%)
          type: number
          format: dp:1

    - name: plot
      title: Descriptive Discriminant Analysis Plot
      type: Image
      requiresData: true
      visible: (plot)
      renderFun: .plot
      refs:
        - ggplot2
      clearWith:
        - covs
        - dep
        - width
        - height
        - showEllipse
        - ellipseLevel

    - name: discScoresTable
      title: Discriminant Scores
      type: Table
      visible: (discScores)
      refs:
        - MASS
      clearWith:
        - covs
        - dep
      columns:
        - name: obs
          title: Observation
          type: text
          content: ($key)

    - name: pairwiseESTable
      title: Pairwise Effect Sizes
      type: Table
      visible: (pairwiseES)
      refs:
        - effsize
      clearWith:
        - covs
        - dep
      columns:
        - name: group1
          title: Group 1
          type: text
        - name: group2
          title: Group 2
          type: text
        - name: cohenD
          title: Cohen's d
          type: number
          format: zto
        - name: hedgesG
          title: Hedges' g
          type: number
          format: zto
...
