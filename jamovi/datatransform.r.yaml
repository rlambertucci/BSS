name: dataTransform
title: Data Transformation
jrs: '1.1'

items:
    - name: transformStatus
      title: Transformation Availability
      type: Preformatted
      visible: true
      clearWith:
        - vars
        - method
        - bounded_scale

    - name: transformInfo
      title: About Data Transformation
      type: Html
      visible: true

    - name: lambdaTable
      title: Lambda (λ) Summary
      type: Table
      visible: (show_lambda_table)
      refs:
        - bestNormalize
        - SuppDists
        - SmithsonVerkuilen2006
        - Bartlett1937
        - Blom1958
        - VanDerWaerden1952
      clearWith:
        - vars
        - method
        - bounded_scale
        - auto_shift
        - int_formula
      columns:
        - name: variable
          title: Variable
          type: text
          combineBelow: true
        - name: method
          title: Method
          type: text
        - name: parameter
          title: Parameter
          type: text
        - name: value
          title: Value
          type: number
        - name: shift_applied
          title: Shift Applied
          type: text
        - name: shift_value
          title: Shift Value
          type: number

    - name: normalityTable
      title: Normality Test (Before & After)
      type: Table
      visible: (show_normality_table)
      refs:
        - ShapiroWilk1965
        - Stephens1974
        - Royston1993
      clearWith:
        - vars
        - method
        - bounded_scale
        - auto_shift
        - int_formula
        - normality_test
        - alpha_sw
      columns:
        - name: variable
          title: Variable
          type: text
          combineBelow: true
        - name: moment
          title: Moment
          type: text
        - name: W
          title: Statistic
          type: number
        - name: p
          title: p-value
          type: number
          format: zto,pvalue
        - name: result
          title: "Decision"
          type: text

    - name: recommendationTable
      title: Transformation Recommender & Ranking
      type: Table
      visible: (show_recommendation_table)
      refs:
        - Blom1958
        - VanDerWaerden1952
        - SmithsonVerkuilen2006
        - bestNormalize
      clearWith:
        - vars
        - auto_shift
        - int_formula
        - normality_test
      columns:
        - name: variable
          title: Variable
          type: text
          combineBelow: true
        - name: rank
          title: Rank
          type: integer
        - name: method
          title: Method
          type: text
        - name: skewness
          title: Skewness
          type: number
        - name: kurtosis
          title: Excess Kurtosis
          type: number
        - name: score
          title: Criterion (|Skew| + 0.5×|Kurt|)
          type: number
        - name: normality_p
          title: Normality p (SW)
          type: number
          format: zto,pvalue
        - name: recommended
          title: Recommendation
          type: text

    - name: distributionPlots
      title: Distribution Diagnostics (Before & After)
      type: Array
      items: (vars)
      visible: (show_qq_plot || show_hist_plot || show_density_plot)
      clearWith:
        - vars
        - method
        - bounded_scale
        - auto_shift
        - int_formula
        - show_qq_plot
        - show_hist_plot
        - show_density_plot
      template:
        title: $key
        type: Image
        width: 650
        height: 400
        renderFun: .distributionPlot
        requiresData: false

    - name: transformedVarsOutput
      type: Output
      title: Transformed Variables
      initInRun: true
      clearWith:
        - data
        - vars
        - method
        - bounded_scale
        - auto_shift
        - int_formula
        - suffix
