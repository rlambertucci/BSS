name: DataPresentation
title: Data Presentation
jus: '3.0'
compilerMode: tame

children:
  - type: ModeSelector
    name: analysisType
    children:
      - type: Content
        name: cross_sectional
        children:
          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: Dependent Variables
                children:
                  - type: VariablesListBox
                    name: deps
                    isTarget: true
              - type: TargetLayoutBox
                label: "Grouping Variables (Cross-Sectional)"
                children:
                  - type: VariablesListBox
                    name: group
                    isTarget: true
              - type: TargetLayoutBox
                label: "Covariate (Optional)"
                children:
                  - type: VariablesListBox
                    name: cov
                    maxItemCount: 1
                    isTarget: true

      - type: Content
        name: longitudinal
        children:
          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: Repeated Measures Variables (Wide Format)
                children:
                  - type: VariablesListBox
                    name: rm_vars
                    isTarget: true
              - type: TargetLayoutBox
                label: "Between-Subjects Factor(s) (Optional)"
                children:
                  - type: VariablesListBox
                    name: group_long
                    isTarget: true
              - type: TargetLayoutBox
                label: "Covariate (Optional)"
                children:
                  - type: VariablesListBox
                    name: cov_long
                    maxItemCount: 1
                    isTarget: true
  - type: CollapseBox
    label: Plot Options
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: ComboBox
            name: plotType
            label: "Plot type"
          - type: ComboBox
            name: summary_distribution
            label: "Distribution"
            enable: (plotType:bar || plotType:meandp)

          - type: ComboBox
            name: intStyle
            label: "Interaction style"

          - type: CheckBox
            name: showLines
            label: "Connect means with line (longitudinal)"
            enable: (analysisType:longitudinal)

          - type: ComboBox
            name: errorType
            label: "Dispersion measure"
            enable: (!plotType:boxplot)

          - type: TextBox
            name: ciWidth
            label: "Confidence interval width (%)"
            suffix: '%'
            format: number
            enable: (!plotType:boxplot && errorType:ci)

          - type: CheckBox
            name: showPoints
            label: "Individual data points"

  - type: CollapseBox
    label: Table Options
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showTable
            label: "Descriptive table"

          - type: ComboBox
            name: tableFormat
            label: "Table format"
            enable: (showTable)

          - type: CheckBox
            name: showCorrMatrix
            label: "Correlation matrix with significance stars"

          - type: ComboBox
            name: corrMethod
            label: "Correlation method"
            enable: (showCorrMatrix || showCorrHeatmap)

          - type: CheckBox
            name: showCorrHeatmap
            label: "Correlation heatmap plot"

          - type: CheckBox
            name: corrCluster
            label: "Hierarchical clustering in heatmap"
            enable: (showCorrHeatmap)

  - type: CollapseBox
    label: Colors
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: ComboBox
            name: colorPalette
            label: "Color palette"



          - type: ComboBox
            name: color1
            label: Color 1
            enable: (colorPalette:manual)

          - type: ComboBox
            name: color2
            label: Color 2
            enable: (colorPalette:manual)

          - type: ComboBox
            name: color3
            label: Color 3
            enable: (colorPalette:manual)

          - type: ComboBox
            name: color4
            label: Color 4
            enable: (colorPalette:manual)

          - type: ComboBox
            name: color5
            label: Color 5
            enable: (colorPalette:manual)

          - type: ComboBox
            name: color6
            label: Color 6
            enable: (colorPalette:manual)

          - type: ComboBox
            name: color7
            label: Color 7
            enable: (colorPalette:manual)

          - type: ComboBox
            name: color8
            label: Color 8
            enable: (colorPalette:manual)

  - type: CollapseBox
    label: Labels & Titles
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: TextBox
            name: titleText
            label: "Plot title"
            format: string

          - type: TextBox
            name: subtitleText
            label: "Plot subtitle"
            format: string

          - type: TextBox
            name: xLabel
            label: "X axis label"
            format: string

          - type: TextBox
            name: yLabel
            label: "Y axis label"
            format: string

  - type: CollapseBox
    label: Axis Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: TextBox
            name: xAngle
            label: "X axis label angle (0–90)"
            suffix: '°'
            format: number

          - type: ComboBox
            name: legendPosition
            label: "Legend position"

          - type: CheckBox
            name: removeGap
            label: "Remove y-axis bottom gap"

          - type: CheckBox
            name: customYAxis
            label: "Custom y-axis scale"

          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: yMin
                label: Minimum
                format: number
                enable: (customYAxis)

              - type: TextBox
                name: yMax
                label: Maximum
                format: number
                enable: (customYAxis)

              - type: TextBox
                name: yStep
                label: "Step (breaks)"
                format: number
                enable: (customYAxis)

  - type: CollapseBox
    label: Font Sizes
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: TextBox
            name: fontSizeTitle
            label: Title
            suffix: pt
            format: number

          - type: TextBox
            name: fontSizeSubtitle
            label: Subtitle
            suffix: pt
            format: number

          - type: TextBox
            name: fontSizeAxisTitle
            label: "Axis titles"
            suffix: pt
            format: number

          - type: TextBox
            name: fontSizeAxis
            label: "Axis text"
            suffix: pt
            format: number

          - type: TextBox
            name: fontSizeLegend
            label: Legend
            suffix: pt
            format: number

  - type: CollapseBox
    label: Line Widths
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: TextBox
            name: lineWidth
            label: "Border width"
            suffix: px
            format: number

          - type: TextBox
            name: errorLineWidth
            label: "Error bar"
            suffix: px
            format: number

          - type: TextBox
            name: axisLineWidth
            label: "Axis lines"
            suffix: px
            format: number

  - type: CollapseBox
    label: Bar & Point Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: TextBox
            name: barWidth
            label: "Bar width"
            format: number

          - type: TextBox
            name: barAlpha
            label: "Bar transparency (alpha)"
            format: number

          - type: TextBox
            name: pointSize
            label: "Point size"
            format: number
            enable: (showPoints)

          - type: TextBox
            name: pointAlpha
            label: "Point transparency (alpha)"
            format: number
            enable: (showPoints)
