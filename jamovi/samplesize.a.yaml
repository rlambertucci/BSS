name:  samplesize
title: "Sample Size Calculation"
menuGroup: BSS
menuSubgroup: Study Design & Presentation
menuSubtitle: Sample size calculation for finite population, animal design, t-tests, TOST and proportions
version: '1.0.0'
jas: '1.2'

options:
  - name: mode
    title: Mode
    type: List
    options:
      - name: finite
        title: "Finite population"
      - name: animals
        title: "Animal designs"
      - name: power_t
        title: "Power & sample size for t-tests"
      - name: tost
        title: "Equivalence testing (TOST)"
      - name: proportions
        title: "Proportions & McNemar test"
    default: finite

  - name: method_finite
    title: Method
    type: List
    options:
      - Cochran
      - Slovin
    default: Slovin

  - name: population_size_finite
    title: "Population size (N)"
    type: Integer
    default: 1000

  - name: confidence_level_finite
    title: "Confidence level (%)"
    type: Number
    default: 95

  - name: margin_error_finite
    title: "Margin of error (%)"
    type: Number
    default: 5

  - name: population_proportion_finite
    title: "Population proportion (p)"
    type: Number
    default: 0.5

  - name: design_animals
    title: "Design type"
    type: List
    options:
      - Design 1 (One-way ANOVA)
      - Design 2 (Repeated Measures)
      - Design 3 (Mixed ANOVA)
    default: Design 1 (One-way ANOVA)

  - name: nGroups_animals
    title: "Number of groups (k) (designs 1 and 3)"
    type: Integer
    default: 2

  - name: nMeasures_animals
    title: "Number of repeated measures (r) (designs 2 and 3)"
    type: Integer
    default: 2

  - name: sacrifice_animals
    title: "Animals sacrificed at each measure (designs 2 and 3)"
    type: Bool
    default: false
  - name: dropout_animals
    title: "Expected attrition / dropout rate (%)"
    type: Number
    min: 0
    max: 50
    default: 10

  - name: calc_power_anova_animals
    title: "Power-based ANOVA sample size comparison"
    type: Bool
    default: false

  - name: power_f_animals
    title: "Effect size (Cohen's f)"
    type: Number
    min: 0.05
    max: 2.0
    default: 0.40

  - name: power_alpha_animals
    title: "Significance level (α)"
    type: Number
    min: 0.001
    max: 0.20
    default: 0.05

  - name: power_target_animals
    title: "Target power (1 - β)"
    type: Number
    min: 0.50
    max: 0.99
    default: 0.80

  # Power & Sample Size for t-tests (BSS-FEAT-016)
  - name: t_test_type
    title: "Test type"
    type: List
    options:
      - name: two_sample
        title: "Two-sample independent t-test"
      - name: one_sample
        title: "One-sample t-test"
      - name: paired
        title: "Paired-samples t-test"
    default: two_sample

  - name: t_effect_size
    title: "Effect size (Cohen's d)"
    type: Number
    default: 0.5

  - name: t_alpha
    title: "Significance level (α)"
    type: Number
    default: 0.05

  - name: t_power
    title: "Target power (1 - β)"
    type: Number
    default: 0.80

  - name: t_alternative
    title: "Alternative hypothesis"
    type: List
    options:
      - name: two_sided
        title: Two-sided
      - name: one_sided
        title: One-sided
    default: two_sided

  - name: show_power_curve
    title: "Power sensitivity curves"
    type: Bool
    default: true

  - name: curve_n_max
    title: "Maximum sample size on curve"
    type: Integer
    default: 150

  # Equivalence Testing (TOST) (BSS-FEAT-017)
  - name: tost_eq_bound
    title: "Equivalence bound (Δ in Cohen's d)"
    type: Number
    default: 0.5

  - name: tost_true_diff
    title: "Expected true difference (δ)"
    type: Number
    default: 0.0

  - name: tost_alpha
    title: "Significance level (α)"
    type: Number
    default: 0.05

  - name: tost_power
    title: "Target power (1 - β)"
    type: Number
    default: 0.80

  - name: tost_type
    title: "Design type"
    type: List
    options:
      - name: two_sample
        title: "Two independent groups"
      - name: paired
        title: "Paired samples"
    default: two_sample

  # Proportions & McNemar Test (BSS-FEAT-018)
  - name: prop_test_type
    title: "Test type"
    type: List
    options:
      - name: two_prop
        title: "Two independent proportions"
      - name: one_prop
        title: "One proportion vs. null value"
      - name: mcnemar
        title: "Paired proportions (McNemar test)"
    default: two_prop

  - name: prop_p1
    title: Proportion 1 (p₁)
    type: Number
    default: 0.60

  - name: prop_p2
    title: Proportion 2 (p₂)
    type: Number
    default: 0.40

  - name: prop_p0
    title: "Null proportion (p₀)"
    type: Number
    default: 0.50

  - name: prop_p12
    title: "Discordant proportion p₁₂ (case + / control -)"
    type: Number
    default: 0.25

  - name: prop_p21
    title: "Discordant proportion p₂₁ (case - / control +)"
    type: Number
    default: 0.10

  - name: prop_alpha
    title: "Significance level (α)"
    type: Number
    default: 0.05

  - name: prop_power
    title: "Target power (1 - β)"
    type: Number
    default: 0.80

  - name: prop_alternative
    title: "Alternative hypothesis"
    type: List
    options:
      - name: two_sided
        title: Two-sided
      - name: one_sided
        title: One-sided
    default: two_sided
