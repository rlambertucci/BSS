name: networkanalysis
title: Network Analysis
jrs: '1.1'

items:
  - name: mixedLimitations
    title: Mixed Network Limitations
    type: Preformatted
    visible: (mode == 'mixed')

  - name: instructions_net
    title: ' '
    type: Preformatted
    visible: (mode == 'continuous')

  - name: summary_net
    title: Network Summary
    type: Table
    visible: (mode == 'continuous')
    refs:
      - bootnet
    clearWith:
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
    columns:
      - name: group
        title: 'Group'
        type: text
        visible: (groupVar_net)
      - name: nodes
        title: 'Nodes'
        type: integer
      - name: edges
        title: 'Edges (Non-zero)'
        type: text
      - name: sparsity
        title: 'Sparsity'
        type: number
        format: zto

  - name: centrality_net
    title: Centrality Measures
    type: Table
    visible: (mode == 'continuous' && tableCentrality_net)
    refs:
      - bootnet
      - qgraph
    clearWith:
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
    columns:
      - name: group
        title: 'Group'
        type: text
        visible: (groupVar_net)
      - name: variable
        title: 'Variable'
        type: text
        format: string
      - name: strength
        title: 'Strength'
        type: number
      - name: closeness
        title: 'Closeness'
        type: number
      - name: betweenness
        title: 'Betweenness'
        type: number
      - name: expectedInfluence
        title: 'Expected Influence'
        type: number

  - name: clustering_net
    title: Clustering Measures per Variable
    type: Table
    visible: (mode == 'continuous' && tableClustering_net)
    refs:
      - bootnet
      - qgraph
      - igraph
    clearWith:
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
    columns:
      - name: group
        title: 'Group'
        type: text
        visible: (groupVar_net)
      - name: node
        title: 'Variable'
        type: text
        format: string
      - name: Barrat
        title: 'Barrat'
        type: number
      - name: Onnela
        title: 'Onnela'
        type: number
      - name: WS
        title: 'WS'
        type: number
      - name: Zhang
        title: 'Zhang'
        type: number


  - name: bridge_net
    title: Bridge Centrality Measures
    type: Table
    visible: (mode == 'continuous' && tableBridge_net)
    refs:
      - Jones2021
      - networktools
    clearWith:
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
      - nodeCommunities_net
      - communityAlgorithm_net
    columns:
      - name: group
        title: 'Group'
        type: text
        visible: (groupVar_net)
      - name: node
        title: 'Variable'
        type: text
        format: string
      - name: community
        title: 'Community'
        type: text
      - name: bridgeStrength
        title: 'Bridge Strength'
        type: number
      - name: bridgeBetweenness
        title: 'Bridge Betweenness'
        type: number
      - name: bridgeCloseness
        title: 'Bridge Closeness'
        type: number
      - name: bridgeEI1
        title: 'Bridge Expected Influence (1-step)'
        type: number

  - name: communities_net
    title: Community Membership
    type: Table
    visible: (mode == 'continuous' && tableCommunities_net)
    refs:
      - Blondel2008
      - igraph
    clearWith:
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
      - communityAlgorithm_net
      - nodeCommunities_net
    columns:
      - name: group
        title: 'Group'
        type: text
        visible: (groupVar_net)
      - name: node
        title: 'Variable'
        type: text
        format: string
      - name: community
        title: 'Community'
        type: text

  - name: weights_net
    title: Weights (Adjacency Matrix)
    type: Table
    visible: (mode == 'continuous' && tableWeights_net)
    clearWith:
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
    columns:
      - name: group
        title: Group
        type: text
        visible: (groupVar_net)
      - name: node
        title: ''
        type: text
        format: string

  - name: centralityPlot_net
    title: Centrality Plot
    type: Image
    requiresData: false
    visible: (mode == 'continuous' && plotCentrality_net)
    renderFun: .plotCentrality_net
    refs:
      - bootnet
      - qgraph
    clearWith:
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
      - nodeCommunities_net

  - name: clusteringPlot_net
    title: Clustering Plot
    type: Image
    requiresData: false
    visible: (mode == 'continuous' && plotClustering_net)
    renderFun: .plotClustering_net
    refs:
      - bootnet
      - qgraph
      - igraph
    clearWith:
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
      - nodeCommunities_net

  - name: networkPlot_net
    title: Network Plot
    type: Image
    requiresData: false
    visible: (mode == 'continuous' && plotNetwork_net)
    renderFun: .plotNetwork_net
    refs:
      - bootnet
      - qgraph
    clearWith:
      - vars_net
      - estimator_net
      - corMethod_net
      - layoutAlgorithm_net
      - showLabels_net
      - plotWidth_net
      - plotHeight_net
      - layoutSeed_net
      - communityAlgorithm_net
      - groupVar_net
      - nodeCommunities_net
  - name: edgeStability_net
    title: Edge Weight Bootstrap Stability (95% CI)
    type: Table
    visible: (mode == 'continuous' && bootStability_net && bootEdgeCI_net)
    refs:
      - bootnet
    clearWith:
      - mode
      - bootStability_net
      - bootSeed_net
      - bootEdgeCI_net
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
      - bootN_net
    columns:
      - name: group
        title: Group
        type: text
      - name: edge
        title: Edge
        type: text
      - name: weight
        title: Sample Weight
        type: number
      - name: boot_mean
        title: Boot Mean
        type: number
      - name: boot_se
        title: Boot SE
        type: number
      - name: ci_lower
        title: 95% CI Lower
        type: number
      - name: ci_upper
        title: 95% CI Upper
        type: number

  - name: csStability_net
    title: Centrality Stability Coefficients (CS-coefficient)
    type: Table
    visible: (mode == 'continuous' && bootStability_net && bootCS_net)
    refs:
      - bootnet
    clearWith:
      - mode
      - bootStability_net
      - bootSeed_net
      - bootCS_net
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
      - bootN_net
    columns:
      - name: group
        title: Group
        type: text
      - name: measure
        title: Centrality Measure
        type: text
      - name: cs_coefficient
        title: CS (cor=0.7)
        type: number
      - name: interpretation
        title: Stability (Epskamp et al., 2018)
        type: text

  - name: nctGlobal_net
    title: 'Network Comparison Test (NCT): Global Invariance'
    type: Table
    visible: (mode == 'continuous' && nctTest_net)
    refs:
      - vanBorkulo2022
    clearWith:
      - mode
      - nctSeed_net
      - nctTest_net
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
      - nctPermutations_net
    columns:
      - name: test
        title: Invariance Metric
        type: text
      - name: statistic
        title: Observed Difference
        type: number
      - name: p_value
        title: Permutation p
        type: number
        format: zto,pvalue

  - name: nctEdges_net
    title: 'Network Comparison Test (NCT): Edge-Specific Invariance'
    type: Table
    visible: (mode == 'continuous' && nctTest_net)
    refs:
      - vanBorkulo2022
    clearWith:
      - mode
      - nctSeed_net
      - nctTest_net
      - vars_net
      - estimator_net
      - corMethod_net
      - groupVar_net
      - nctPermutations_net
    columns:
      - name: edge
        title: Edge
        type: text
      - name: weight_g1
        title: Group 1 Weight
        type: number
      - name: weight_g2
        title: Group 2 Weight
        type: number
      - name: diff
        title: Abs Difference
        type: number
      - name: p_value
        title: Permutation p
        type: number
        format: zto,pvalue

  - name: resamplingDiagnostics_net
    title: Network Resampling Diagnostics
    type: Table
    visible: (mode == 'continuous' && (bootStability_net || nctTest_net))
    refs:
      - bootnet
    clearWith:
      - mode
      - vars_net
      - groupVar_net
      - estimator_net
      - corMethod_net
      - bootStability_net
      - bootEdgeCI_net
      - bootCS_net
      - bootN_net
      - bootSeed_net
      - nctTest_net
      - nctPermutations_net
      - nctSeed_net
    columns:
      - name: group
        title: Group
        type: text
      - name: procedure
        title: Procedure
        type: text
      - name: requested
        title: Requested
        type: integer
      - name: completed
        title: Completed
        type: integer
      - name: failed
        title: Failed
        type: integer
      - name: unattempted
        title: Not Attempted
        type: integer
      - name: regularized
        title: PD Adjustments
        type: integer
      - name: status
        title: Status
        type: text

  - name: instructions_mixed
    title: ' '
    type: Preformatted
    visible: (mode == 'mixed')

  - name: summary_mixed
    title: Network Summary
    type: Table
    visible: (mode == 'mixed')
    refs:
      - mgm
    clearWith:
      - varsCont_mixed
      - varsCat_mixed
      - varsCount_mixed
      - groupVar_mixed
      - nodeCommunities_mixed
      - lambdaSelMethod_mixed
      - kFolds_mixed
      - lambdaGam_mixed
      - ruleReg_mixed
    columns:
      - name: group
        title: 'Group'
        type: text
        visible: (groupVar_mixed)
      - name: nodes
        title: 'Nodes'
        type: integer
      - name: edges
        title: 'Edges (Non-zero)'
        type: text
      - name: sparsity
        title: 'Sparsity'
        type: number
        format: zto

  - name: centrality_mixed
    title: Centrality Measures
    type: Table
    visible: (mode == 'mixed' && tableCentrality_mixed)
    refs:
      - mgm
      - qgraph
    clearWith:
      - varsCont_mixed
      - varsCat_mixed
      - varsCount_mixed
      - groupVar_mixed
      - nodeCommunities_mixed
      - lambdaSelMethod_mixed
      - kFolds_mixed
      - lambdaGam_mixed
      - ruleReg_mixed
    columns:
      - name: group
        title: 'Group'
        type: text
        visible: (groupVar_mixed)
      - name: variable
        title: 'Variable'
        type: text
        format: string
      - name: strength
        title: 'Strength'
        type: number
      - name: closeness
        title: 'Closeness'
        type: number
      - name: betweenness
        title: 'Betweenness'
        type: number
      - name: expectedInfluence
        title: 'Expected Influence'
        type: number

  - name: clustering_mixed
    title: Clustering Measures per Variable
    type: Table
    visible: (mode == 'mixed' && tableClustering_mixed)
    refs:
      - mgm
      - qgraph
      - igraph
    clearWith:
      - varsCont_mixed
      - varsCat_mixed
      - varsCount_mixed
      - groupVar_mixed
      - nodeCommunities_mixed
      - lambdaSelMethod_mixed
      - kFolds_mixed
      - lambdaGam_mixed
      - ruleReg_mixed
    columns:
      - name: group
        title: 'Group'
        type: text
        visible: (groupVar_mixed)
      - name: node
        title: 'Variable'
        type: text
        format: string
      - name: Barrat
        title: 'Barrat'
        type: number
      - name: Onnela
        title: 'Onnela'
        type: number
      - name: WS
        title: 'WS'
        type: number
      - name: Zhang
        title: 'Zhang'
        type: number


  - name: bridge_mixed
    title: Bridge Centrality Measures
    type: Table
    visible: (mode == 'mixed' && tableBridge_mixed)
    refs:
      - Jones2021
      - networktools
    clearWith:
      - varsCont_mixed
      - varsCat_mixed
      - varsCount_mixed
      - groupVar_mixed
      - nodeCommunities_mixed
      - lambdaSelMethod_mixed
      - kFolds_mixed
      - lambdaGam_mixed
      - ruleReg_mixed
      - communityAlgorithm_mixed
    columns:
      - name: group
        title: 'Group'
        type: text
        visible: (groupVar_mixed)
      - name: node
        title: 'Variable'
        type: text
        format: string
      - name: community
        title: 'Community'
        type: text
      - name: bridgeStrength
        title: 'Bridge Strength'
        type: number
      - name: bridgeBetweenness
        title: 'Bridge Betweenness'
        type: number
      - name: bridgeCloseness
        title: 'Bridge Closeness'
        type: number
      - name: bridgeEI1
        title: 'Bridge Expected Influence (1-step)'
        type: number

  - name: communities_mixed
    title: Community Membership
    type: Table
    visible: (mode == 'mixed' && tableCommunities_mixed)
    refs:
      - Blondel2008
      - igraph
    clearWith:
      - varsCont_mixed
      - varsCat_mixed
      - varsCount_mixed
      - groupVar_mixed
      - nodeCommunities_mixed
      - lambdaSelMethod_mixed
      - kFolds_mixed
      - lambdaGam_mixed
      - ruleReg_mixed
      - communityAlgorithm_mixed
    columns:
      - name: group
        title: 'Group'
        type: text
        visible: (groupVar_mixed)
      - name: node
        title: 'Variable'
        type: text
        format: string
      - name: community
        title: 'Community'
        type: text

  - name: weights_mixed
    title: Weights (Adjacency Matrix)
    type: Table
    visible: (mode == 'mixed' && tableWeights_mixed)
    refs:
      - mgm
    clearWith:
      - varsCont_mixed
      - varsCat_mixed
      - varsCount_mixed
      - groupVar_mixed
      - nodeCommunities_mixed
      - lambdaSelMethod_mixed
      - kFolds_mixed
      - lambdaGam_mixed
      - ruleReg_mixed
    columns:
      - name: group
        title: 'Group'
        type: text
        visible: (groupVar_mixed)
      - name: rowname
        title: ''
        type: text
        format: string

  - name: centralityPlot_mixed
    title: Centrality Plot
    type: Image
    requiresData: false
    visible: (mode == 'mixed' && plotCentrality_mixed)
    renderFun: .plotCentrality_mixed
    refs:
      - mgm
      - qgraph
    clearWith:
      - varsCont_mixed
      - varsCat_mixed
      - varsCount_mixed
      - groupVar_mixed
      - nodeCommunities_mixed
      - lambdaSelMethod_mixed
      - kFolds_mixed
      - lambdaGam_mixed
      - ruleReg_mixed

  - name: clusteringPlot_mixed
    title: Clustering Plot
    type: Image
    requiresData: false
    visible: (mode == 'mixed' && plotClustering_mixed)
    renderFun: .plotClustering_mixed
    refs:
      - mgm
      - qgraph
      - igraph
    clearWith:
      - varsCont_mixed
      - varsCat_mixed
      - varsCount_mixed
      - groupVar_mixed
      - nodeCommunities_mixed
      - lambdaSelMethod_mixed
      - kFolds_mixed
      - lambdaGam_mixed
      - ruleReg_mixed

  - name: networkPlot_mixed
    title: Network Plot
    type: Image
    requiresData: false
    visible: (mode == 'mixed' && plotNetwork_mixed)
    renderFun: .plotNetwork_mixed
    refs:
      - mgm
      - qgraph
    clearWith:
      - varsCont_mixed
      - varsCat_mixed
      - varsCount_mixed
      - groupVar_mixed
      - nodeCommunities_mixed
      - lambdaSelMethod_mixed
      - kFolds_mixed
      - lambdaGam_mixed
      - ruleReg_mixed
      - layoutAlgorithm_mixed
      - showLabels_mixed
      - plotWidth_mixed
      - plotHeight_mixed
      - layoutSeed_mixed
      - communityAlgorithm_mixed
