---
name: outliers
title: "Outlier Detection and Treatment"
menuGroup: BSS
menuSubgroup: Data Preparation & Screening
menuSubtitle: Multi-method outlier detection and treatment (Dixon’s Q Test, IQR, modified Z-score, Mahalanobis & MCD)
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: mode
      title: "Outlier detection method"
      type: List
      options:
        - title: "Dixon's Q test"
          name: dixon
        - title: "Modified z-score"
          name: modz
        - title: "IQR (interquartile range)"
          name: iqr
        - title: "Multivariate (mahalanobis & robust MCD)"
          name: mahalanobis
      default: iqr

    - name: var_dixon
      title: Variable
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric

    - name: group_dixon
      title: Grouping Variables
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: alpha_dixon
      title: "Significance level"
      type: List
      options:
        - name: alpha10
          title: '90% (α = 0.10)'
        - name: alpha05
          title: '95% (α = 0.05)'
        - name: alpha01
          title: '99% (α = 0.01)'
      default: alpha05

    - name: treatment_dixon
      title: "Treatment method"
      type: List
      options:
        - name: none
          title: "None (detection only)"
        - name: trim_asym
          title: "Asymmetric trimming (identified outlier)"
        - name: win_valid
          title: "Winsorize (to max/min valid value)"
      default: none

    - name: dispBox_dixon
      title: "Boxplot"
      type: Bool
      default: false

    - name: treatedData_dixon
      title: Save treated variable to dataset
      type: Output

    - name: vars_modz
      title: Variables
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric

    - name: group_modz
      title: Grouping Variables
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: threshold_modz
      title: Threshold
      type: List
      options:
        - name: t25
          title: '2.5 (Leys et al., 2013)'
        - name: t30
          title: '3.0 (Wilcox, 2017)'
        - name: t35
          title: '3.5 (Iglewicz & Hoaglin, 1993)'
        - name: t40
          title: '4.0 (Iglewicz & Hoaglin, 1993)'
      default: t35

    - name: treatment_modz
      title: "Treatment method"
      type: List
      options:
        - name: none
          title: "None (detection only)"
        - name: trim_asym
          title: "Asymmetric trimming (identified outliers)"
        - name: trim_sym
          title: "Symmetric trimming (%)"
        - name: win_valid
          title: "Winsorize (to max/min valid value)"
        - name: win_fence
          title: "Winsorize (to threshold limits)"
      default: none

    - name: trimPercent_modz
      title: "Symmetric trimming percentage (%)"
      type: Number
      default: 5
      min: 1
      max: 49

    - name: dispBox_modz
      title: "Boxplot"
      type: Bool
      default: false

    - name: treatedData_modz
      title: Save treated variables to dataset
      type: Output

    - name: vars_iqr
      title: Variables
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric

    - name: group_iqr
      title: Grouping Variables
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: iqrMultiplier_iqr
      title: "IQR multiplier range"
      type: List
      options:
        - name: iqr15
          title: "1.5 X IQR (classic)"
        - name: iqr22
          title: "2.2 X IQR"
        - name: iqr30
          title: "3.0 X IQR (extreme)"
      default: iqr15

    - name: adj_box_iqr
      title: "Adjusted boxplot for skewed distributions (Hubert & Vandervieren, 2008)"
      type: Bool
      default: false

    - name: treatment_iqr
      title: "Treatment method"
      type: List
      options:
        - name: none
          title: "None (detection only)"
        - name: trim_asym
          title: "Asymmetric trimming (identified outliers)"
        - name: trim_sym
          title: "Symmetric trimming (%)"
        - name: win_valid
          title: "Winsorize (to max/min valid value)"
        - name: win_fence
          title: "Winsorize (to fence limits)"
      default: none

    - name: trimPercent_iqr
      title: "Symmetric trimming percentage (%)"
      type: Number
      default: 5
      min: 1
      max: 49

    - name: dispBox_iqr
      title: "Boxplot"
      type: Bool
      default: true

    - name: treatedData_iqr
      title: Save treated variables to dataset
      type: Output

    # Multivariate Outliers: Mahalanobis & MCD (BSS-FEAT-019..021)
    - name: vars_mah
      title: Variables
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric

    - name: method_mah
      title: "Estimation method"
      type: List
      options:
        - name: classic
          title: "Classical mahalanobis distance"
        - name: robust_mcd
          title: "Robust minimum covariance determinant (MCD)"
      default: classic

    - name: alpha_mah
      title: "Significance level (cutoff)"
      type: List
      options:
        - name: p001
          title: "P < .001 (conservative / recommended)"
        - name: p01
          title: "P < .01"
        - name: p05
          title: "P < .05"
      default: p001

    - name: dispPlot_mah
      title: "Chi-square Q-Q plot"
      type: Bool
      default: true

    - name: treatedData_mah
      title: "Save Mahalanobis outlier flag to dataset"
      type: Output
