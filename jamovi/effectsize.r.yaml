name: effectSize
title: Effect Size
jrs: '1.1'
items:
    - name: analysisInfo
      title: About Effect Size Analysis
      type: Html
      visible: true

    - name: effectSizeTable
      title: Within-Subjects Effect Sizes (Time Effects)
      type: Table
      visible: (run_analysis)
      refs:
        - effectsize
        - emmeans
        - Cohen1988
        - AlginaKeselmanPenfield2005
        - AkritasArnold1994
      clearWith:
        - mode
        - dep_vars_cs
        - indep_vars_cs
        - dep_vars_long
        - include_interactions
        - es_method
        - reference_group
        - glass_references
        - use_glm
        - es_glm
        - ci_method
        - n_bootstrap
        - ci_level
        - run_analysis
        - long_format
        - time_var
        - wave_vars
        - subject_id_var
        - es_method_long
        - reference_group_long
        - cov
      columns:
        - name: dv
          title: DV
          type: text
          combineBelow: true
        - name: iv
          title: IV
          type: text
          combineBelow: true
        - name: comparison
          title: Comparison
          type: text
        - name: method
          title: Method
          type: text
        - name: es_value
          title: Effect Size
          type: number
        - name: ci_lower
          title: CI Lower
          type: number
        - name: ci_upper
          title: CI Upper
          type: number
        - name: interpretation
          title: Interpretation
          type: text
        - name: n_obs
          title: N
          type: integer

    - name: clesTable
      title: Common Language Effect Size (CLES) - Independent Samples
      type: Table
      visible: (run_analysis && mode == 'cross_sectional' && show_cles)
      refs:
        - effectsize
        - emmeans
        - Cohen1988
      clearWith:
        - mode
        - dep_vars_cs
        - indep_vars_cs
        - include_interactions
        - es_method
        - reference_group
        - glass_references
        - use_glm
        - es_glm
        - ci_method
        - n_bootstrap
        - ci_level
        - run_analysis
        - show_cles
        - cov
      columns:
        - name: dv
          title: DV
          type: text
          combineBelow: true
        - name: iv
          title: IV
          type: text
          combineBelow: true
        - name: comparison
          title: Comparison
          type: text
        - name: cles
          title: CLES
          type: number

    - name: clesLongTable
      title: Common Language Effect Size (CLES) - Paired Samples
      type: Table
      visible: (run_analysis && mode == 'longitudinal' && show_cles_long)
      refs:
        - effectsize
        - emmeans
        - Cohen1988
      clearWith:
        - mode
        - run_analysis
        - dep_vars_long
        - long_format
        - time_var
        - wave_vars
        - subject_id_var
        - es_method_long
        - reference_group_long
        - show_cles_long
        - cov
      columns:
        - name: dv
          title: DV
          type: text
          combineBelow: true
        - name: comparison
          title: Comparison
          type: text
        - name: cles
          title: CLES (paired)
          type: number

    - name: conversionTable
      title: Independent Cohen's d Conversions
      type: Table
      visible: (run_analysis && show_conversions)
      refs:
        - Borenstein2009
        - Cohen1988
      clearWith:
        - mode
        - dep_vars_cs
        - indep_vars_cs
        - dep_vars_long
        - include_interactions
        - cov
        - use_glm
        - es_method
        - es_method_long
        - long_format
        - time_var
        - wave_vars
        - subject_id_var
        - run_analysis
        - show_conversions
      columns:
        - name: dv
          title: DV / Wave
          type: text
          combineBelow: true
        - name: comparison
          title: Comparison
          type: text
        - name: cohen_d
          title: "Cohen's d"
          type: number
        - name: correlation_r
          title: "Point-Biserial r (pooled t)"
          type: number
        - name: eta_squared
          title: "Eta-squared (η²)"
          type: number
        - name: odds_ratio
          title: "Approx. Odds Ratio (OR)"
          type: number
        - name: auc
          title: "Normal-model AUC"
          type: number
        - name: interpretation
          title: Interpretation
          type: text

    - name: categoricalTable
      title: Categorical Effect Sizes (Association & Risk)
      type: Table
      visible: (!is.null(cat_var1) && !is.null(cat_var2))
      refs:
        - Cramer1946
        - Cohen1988
        - effectsize
      clearWith:
        - cat_var1
        - cat_var2
        - ci_method
        - ci_level
        - n_bootstrap
      columns:
        - name: pair
          title: Variable Pair
          type: text
        - name: metric
          title: Metric
          type: text
        - name: value
          title: Estimate
          type: number
        - name: ci_lower
          title: CI Lower
          type: number
        - name: ci_upper
          title: CI Upper
          type: number
        - name: interpretation
          title: Interpretation
          type: text
        - name: n_obs
          title: N
          type: integer

    - name: directCalcTable
      title: Direct Test Statistic Conversions
      type: Table
      visible: (calc_from_test_stat)
      refs:
        - Cohen1988
        - Borenstein2009
      clearWith:
        - stat_type
        - stat_val
        - stat_df1
        - stat_df2
        - stat_rows
        - stat_cols
        - stat_n
        - calc_from_test_stat
      columns:
        - name: input_stat
          title: Input Statistic
          type: text
        - name: metric
          title: Effect Size Metric
          type: text
        - name: value
          title: Value
          type: number
        - name: interpretation
          title: Benchmark Interpretation
          type: text
        - name: formula_ref
          title: Primary Formula
          type: text

    - name: esPlot
      title: Effect Size Forest Plot
      type: Image
      width: 650
      height: 450
      renderFun: .renderESPlot
      visible: (run_analysis && show_es_plot)
      requiresData: false
      clearWith:
        - cov
        - reference_group
        - glass_references
        - reference_group_long
        - use_glm
        - es_glm
        - ci_method
        - n_bootstrap
        - ci_level
        - benchmark_standard
        - show_cles
        - show_cles_long
        - mode
        - dep_vars_cs
        - indep_vars_cs
        - dep_vars_long
        - include_interactions
        - es_method
        - es_method_long
        - long_format
        - time_var
        - wave_vars
        - subject_id_var
        - run_analysis
        - show_es_plot
        - plot_width
        - plot_height

    - name: text
      title: Analysis Summary
      type: Preformatted
      visible: false
      clearWith:
        - mode
        - dep_vars_cs
        - indep_vars_cs
        - dep_vars_long
        - include_interactions
        - es_method
        - reference_group
        - glass_references
        - use_glm
        - es_glm
        - ci_method
        - n_bootstrap
        - ci_level
        - run_analysis
        - long_format
        - time_var
        - wave_vars
        - subject_id_var
        - es_method_long
        - reference_group_long
        - cat_var1
        - cat_var2
        - calc_from_test_stat
