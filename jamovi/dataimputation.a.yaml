---
name:  dataimputation
title: "Missing Data Analysis and Imputation"
menuGroup: BSS
menuSubgroup: Data Preparation & Screening
menuSubtitle: missRanger and Multiple Imputation by Chained Equations (MICE)
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: mode
      title: "Analysis mode"
      type: List
      options:
        - title: "MICE (cross-sectional)"
          name: mice_cs
        - title: "MICE (longitudinal)"
          name: mice_long
        - title: "missRanger (random forest)"
          name: missranger
      default: mice_cs

    - name: vars_mice_cs
      title: Variables to Impute (Cross-sectional)
      type: Variables
      suggested:
        - continuous
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor

    - name: predictor_vars_mice_cs
      title: Predictor Variables (optional)
      type: Variables
      suggested:
        - continuous
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor

    - name: imputation_method_mice_cs
      title: "Imputation method"
      type: List
      options:
        - title: "PMM — predictive mean matching"
          name: pmm
        - title: "Bayesian linear regression"
          name: norm
        - title: "Logistic regression (binary)"
          name: logreg
        - title: "Polytomous regression"
          name: polyreg
      default: pmm

    - name: num_imputations_mice_cs
      title: "Number of imputations (m)"
      type: Integer
      default: 5
      min: 2
      max: 50

    - name: maxiter_mice_cs
      title: "Maximum iterations"
      type: Integer
      default: 10
      min: 1
      max: 100

    - name: use_seed_mice_cs
      title: Use a fixed seed
      type: Bool
      default: false

    - name: seed_mice_cs
      title: Seed
      type: Integer
      default: 0
      min: -2147483647
      max: 2147483647

    - name: run_imputation_mice_cs
      title: "Imputation results"
      type: Bool
      default: false

    - name: show_pattern_plot_mice_cs
      title: "Missing data pattern"
      type: Bool
      default: false

    - name: show_pattern_table_mice_cs
      title: "Missing data patterns table"
      type: Bool
      default: false

    - name: show_correlation_plot_mice_cs
      title: "Missingness correlation heatmap"
      type: Bool
      default: false

    - name: show_trace_plot_mice_cs
      title: "Convergence trace plot"
      type: Bool
      default: false

    - name: show_density_plot_mice_cs
      title: "Observed vs imputed distribution"
      type: Bool
      default: false

    - name: show_strip_plot_mice_cs
      title: "Strip plot by variable"
      type: Bool
      default: false

    - name: show_pooled_summary_mice_cs
      title: "Pooled parameter summary (Rubin's rules)"
      type: Bool
      default: false

    - name: show_upset_plot_mice_cs
      title: "Missing data UpSet plot"
      type: Bool
      default: false

    - name: enable_model_pooling_mice_cs
      title: "Predictive modeling with pooling"
      type: Bool
      default: false

    - name: model_type_mice_cs
      title: "Model type"
      type: List
      options:
        - title: "Linear regression (OLS)"
          name: lm
        - title: "Logistic regression (binary)"
          name: logit
        - title: "ANOVA (linear model)"
          name: anova
      default: lm

    - name: model_dep_mice_cs
      title: Dependent Variable (Y)
      type: Variable
      suggested:
        - continuous
        - nominal
      permitted:
        - numeric
        - factor

    - name: model_indep_mice_cs
      title: Predictor Variables (X)
      type: Variables
      suggested:
        - continuous
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor


    - name: imputedColsOutput_mice_cs
      title: "Save aggregated imputed variables (single dataset)"
      type: Output

    - name: vars_mice_long
      title: Variables to Impute (Longitudinal)
      type: Variables
      suggested:
        - continuous
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor

    - name: predictor_vars_mice_long
      title: Predictor Variables (optional)
      type: Variables
      suggested:
        - continuous
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor

    - name: data_format_mice_long
      title: "Data format"
      type: List
      options:
        - title: "Cross-sectional / long format"
          name: long
        - title: Wide format (repeated measures)
          name: wide
      default: wide

    - name: subject_id_var_mice_long
      title: Subject ID Variable
      type: Variable
      suggested:
        - nominal
        - id
      permitted:
        - factor
        - numeric
        - id

    - name: time_var_mice_long
      title: Time / Wave Variable
      type: Variable
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
        - factor

    - name: group_var_mice_long
      title: Group / Cluster Variable
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor

    - name: fixed_covariates_mice_long
      title: Fixed Covariates (predictors only)
      type: Variables
      suggested:
        - continuous
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor

    - name: wave_vars_mice_long
      title: Wave Columns (wide format)
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
        - factor

    - name: imputation_method_mice_long
      title: "Imputation method"
      type: List
      options:
        - title: "Two-level predictive mean matching"
          name: 2l.pmm
        - title: "Two-level normal imputation"
          name: 2l.continuous
      default: 2l.pmm

    - name: num_imputations_mice_long
      title: "Number of imputations (m)"
      type: Integer
      default: 5
      min: 2
      max: 50

    - name: maxiter_mice_long
      title: "Maximum iterations"
      type: Integer
      default: 10
      min: 1
      max: 100

    - name: use_seed_mice_long
      title: Use a fixed seed
      type: Bool
      default: false

    - name: seed_mice_long
      title: Seed
      type: Integer
      default: 0
      min: -2147483647
      max: 2147483647

    - name: run_imputation_mice_long
      title: "Imputation results"
      type: Bool
      default: false

    - name: show_pattern_plot_mice_long
      title: "Missing data pattern"
      type: Bool
      default: false

    - name: show_pattern_table_mice_long
      title: "Missing data patterns table"
      type: Bool
      default: false

    - name: show_correlation_plot_mice_long
      title: "Missingness correlation heatmap"
      type: Bool
      default: false

    - name: show_trace_plot_mice_long
      title: "Convergence trace plot"
      type: Bool
      default: false

    - name: show_density_plot_mice_long
      title: "Observed vs imputed distribution"
      type: Bool
      default: false

    - name: show_strip_plot_mice_long
      title: "Strip plot by variable"
      type: Bool
      default: false

    - name: show_pooled_summary_mice_long
      title: "Pooled parameter summary (Rubin's rules)"
      type: Bool
      default: false

    - name: show_upset_plot_mice_long
      title: "Missing data UpSet plot"
      type: Bool
      default: false

    - name: enable_model_pooling_mice_long
      title: "Predictive modeling with pooling"
      type: Bool
      default: false

    - name: model_type_mice_long
      title: "Model type"
      type: List
      options:
        - title: "Linear regression (OLS)"
          name: lm
        - title: "Logistic regression (binary)"
          name: logit
        - title: "ANOVA (linear model)"
          name: anova
      default: lm

    - name: model_dep_mice_long
      title: Dependent Variable (Y)
      type: Variable
      suggested:
        - continuous
        - nominal
      permitted:
        - numeric
        - factor

    - name: model_indep_mice_long
      title: Predictor Variables (X)
      type: Variables
      suggested:
        - continuous
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor


    - name: imputedColsOutput_mice_long
      title: "Save aggregated imputed variables (single dataset)"
      type: Output

