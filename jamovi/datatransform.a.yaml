name: dataTransform
title: Data Transformation
menuGroup: BSS
menuSubgroup: Data Preparation & Screening
menuSubtitle: Power & bounded transformations for normality (Box-Cox, Yeo-Johnson, Johnson, Arcsine, Logit)
version: '0.0.1'
jas: '1.2'

options:

    - name: data
      type: Data
      title: "Input data"

    - name: vars
      title: Variables to Transform
      type: Variables
      suggested:
        - continuous
      required: true
      permitted:
        - numeric

    - name: method
      title: "Transformation method"
      type: List
      options:
        - title: Box-Cox
          name: boxcox
        - title: Yeo-Johnson
          name: yeojohnson
        - title: Johnson
          name: johnson
        - title: "Arcsine square root (proportions / rates)"
          name: arcsine
        - title: "Logit (Smithson-Verkuilen compression)"
          name: logit
        - title: "Rank-based inverse normal (INT / van der Waerden, Blom, Tukey)"
          name: int
      default: yeojohnson

    - name: bounded_scale
      title: "Input scale for arcsine and logit"
      type: List
      options:
        - name: proportion
          title: "Proportions (0 to 1)"
        - name: percentage
          title: "Percentages (0 to 100)"
      default: proportion

    - name: auto_shift
      title: "Automatic shift for non-positive values"
      type: Bool
      default: true

    - name: suffix
      title: "Suffix for transformed variable name"
      type: String
      default: '_transformed'

    - name: show_lambda_table
      title: "Lambda (λ) summary table"
      type: Bool
      default: true

    - name: show_normality_table
      title: "Normality test (before & after)"
      type: Bool
      default: true

    - name: normality_test
      title: "Normality test method"
      type: List
      options:
        - name: shapiro
          title: "Shapiro-Wilk test"
        - name: anderson_darling
          title: "Anderson-Darling test"
        - name: shapiro_francia
          title: "Shapiro-Francia test"
      default: shapiro

    - name: alpha_sw
      title: "Significance level (α) for normality test"
      type: Number
      default: 0.05
      min: 0.01
      max: 0.10

    - name: show_qq_plot
      title: "Q-q plot (before & after)"
      type: Bool
      default: true

    - name: show_hist_plot
      title: Histogram (before & after)
      type: Bool
      default: true

    - name: show_density_plot
      title: "Density plot (before & after)"
      type: Bool
      default: true

    - name: transformedVarsOutput
      title: "Save transformed variables to spreadsheet"
      type: Output

    - name: int_formula
      title: "Rank-based formula"
      type: List
      options:
        - name: blom
          title: Blom (c = 3/8)
        - name: vdw
          title: "van der Waerden (c = 0)"
        - name: tukey
          title: Tukey (c = 1/3)
        - name: rankit
          title: Rankit (c = 1/2)
      default: blom

    - name: show_recommendation_table
      title: "Transformation recommender & ranking"
      type: Bool
      default: false
