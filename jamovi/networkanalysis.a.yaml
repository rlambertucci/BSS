name:  networkanalysis
title: "Network Analysis"
menuGroup: BSS
menuSubgroup: Associations & Networks
menuSubtitle: Network analysis for continuous (GGM) and mixed (MGM) data
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: mode
      title: "Analysis mode"
      type: List
      options:
        - title: For continuous data
          name: continuous
        - title: For mixed data
          name: mixed
      default: continuous

    - name: vars_net
      title: Variables
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric

    - name: groupVar_net
      title: Grouping Variable
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: null

    - name: nodeCommunities_net
      title: Node communities
      type: Array
      default: []
      template:
        type: Group
        elements:
          - name: label
            title: Community
            type: String
            default: ""
          - name: variables
            title: Variables
            type: Variables
            permitted:
              - numeric
              - factor
            default: []

    - name: estimator_net
      title: Estimator
      type: List
      options:
        - name: EBICglasso
          title: EBICglasso
        - name: correlation
          title: Correlation
        - name: partial_correlation
          title: "Partial correlation"
      default: EBICglasso

    - name: corMethod_net
      title: "Correlation method"
      type: List
      options:
        - name: auto
          title: Auto
        - name: cor
          title: "Correlation matrix"
        - name: cov
          title: "Covariance matrix"
      default: auto

    - name: tableCentrality_net
      title: "Centrality table"
      type: Bool
      default: TRUE

    - name: tableBridge_net
      title: "Bridge centrality table"
      type: Bool
      default: FALSE

    - name: tableClustering_net
      title: "Clustering table"
      type: Bool
      default: FALSE

    - name: tableCommunities_net
      title: "Community detection table"
      type: Bool
      default: FALSE

    - name: communityAlgorithm_net
      title: "Community detection algorithm"
      type: List
      options:
        - name: none
          title: "None (use assigned node communities)"
        - name: walktrap
          title: Walktrap (Pons & Latapy, 2005)
        - name: louvain
          title: Louvain (Blondel et al., 2008)
      default: none

    - name: tableWeights_net
      title: "Weights (adjacency) table"
      type: Bool
      default: FALSE

    - name: plotCentrality_net
      title: "Centrality plot"
      type: Bool
      default: FALSE

    - name: plotClustering_net
      title: "Clustering plot"
      type: Bool
      default: FALSE

    - name: plotNetwork_net
      title: "Network plot"
      type: Bool
      default: FALSE

    - name: layoutAlgorithm_net
      title: "Layout algorithm"
      type: List
      options:
        - name: spring
          title: Spring (Fruchterman-Reingold)
        - name: circle
          title: Circle
      default: spring

    - name: layoutSeed_net
      title: "Layout random seed"
      type: Integer
      default: 100

    - name: showLabels_net
      title: "Labels"
      type: Bool
      default: TRUE

    - name: plotWidth_net
      title: "Network plot width"
      type: Integer
      default: 500

    - name: plotHeight_net
      title: "Network plot height"
      type: Integer
      default: 500

    - name: bootStability_net
      title: "Network stability"
      type: Bool
      default: FALSE

    - name: bootSeed_net
      title: "Bootstrap random seed"
      type: Integer
      default: 100
      min: 0
      max: 2147483647

    - name: bootN_net
      title: "Bootstrap samples"
      type: Integer
      default: 100
      min: 10
      max: 2000

    - name: bootEdgeCI_net
      title: "Edge weight confidence intervals"
      type: Bool
      default: TRUE

    - name: bootCS_net
      title: "Centrality stability coefficient (CS-coefficient)"
      type: Bool
      default: TRUE

    - name: nctTest_net
      title: "Network comparison test (NCT)"
      type: Bool
      default: FALSE

    - name: nctSeed_net
      title: "NCT permutation seed"
      type: Integer
      default: 100
      min: 0
      max: 2147483647

    - name: nctPermutations_net
      title: "NCT permutations"
      type: Integer
      default: 100
      min: 20
      max: 2000

    - name: varsCont_mixed
      title: Continuous Variables (Gaussian)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: varsCat_mixed
      title: Categorical Variables
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: null

    - name: varsCount_mixed
      title: Count Variables (Poisson)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: groupVar_mixed
      title: Grouping Variable
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: null

    - name: nodeCommunities_mixed
      title: Node communities
      type: Array
      default: []
      template:
        type: Group
        elements:
          - name: label
            title: Community
            type: String
            default: ""
          - name: variables
            title: Variables
            type: Variables
            permitted:
              - numeric
              - factor
            default: []

    - name: lambdaSelMethod_mixed
      title: "Lambda selection method"
      type: List
      options:
        - name: EBIC
          title: Extended BIC (EBIC)
        - name: CV
          title: "Cross-validation (CV)"
      default: EBIC

    - name: kFolds_mixed
      title: "Number of folds (if CV selected)"
      type: Integer
      default: 3
      min: 2

    - name: lambdaGam_mixed
      title: Gamma for EBIC (if EBIC selected)
      type: Number
      default: 0.5
      min: 0
      max: 1

    - name: ruleReg_mixed
      title: "Parameter combination rule"
      type: List
      options:
        - name: AND
          title: AND-rule
        - name: OR
          title: OR-rule
      default: AND

    - name: tableCentrality_mixed
      title: "Centrality table"
      type: Bool
      default: TRUE

    - name: tableBridge_mixed
      title: "Bridge centrality table"
      type: Bool
      default: FALSE

    - name: tableClustering_mixed
      title: "Clustering table"
      type: Bool
      default: FALSE

    - name: tableCommunities_mixed
      title: "Community detection table"
      type: Bool
      default: FALSE

    - name: communityAlgorithm_mixed
      title: "Community detection algorithm"
      type: List
      options:
        - name: none
          title: "None (use assigned node communities)"
        - name: walktrap
          title: Walktrap (Pons & Latapy, 2005)
        - name: louvain
          title: Louvain (Blondel et al., 2008)
      default: none

    - name: tableWeights_mixed
      title: "Weights (adjacency) table"
      type: Bool
      default: FALSE

    - name: plotCentrality_mixed
      title: "Centrality plot"
      type: Bool
      default: FALSE

    - name: plotClustering_mixed
      title: "Clustering plot"
      type: Bool
      default: FALSE

    - name: plotNetwork_mixed
      title: "Network plot"
      type: Bool
      default: TRUE

    - name: layoutAlgorithm_mixed
      title: "Layout algorithm"
      type: List
      options:
        - name: spring
          title: Spring (Fruchterman-Reingold)
        - name: circle
          title: Circle
      default: spring

    - name: layoutSeed_mixed
      title: "Layout random seed"
      type: Integer
      default: 100

    - name: showLabels_mixed
      title: "Labels"
      type: Bool
      default: TRUE

    - name: plotWidth_mixed
      title: "Network plot width"
      type: Integer
      default: 500

    - name: plotHeight_mixed
      title: "Network plot height"
      type: Integer
      default: 500
