---
name: correlationComparison
title: Compare Correlations
jus: '3.0'
compilerMode: tame
children:
  - type: ModeSelector
    name: mode
    stretchFactor: 1
    children:

      - type: Content
        name: independent
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: TextBox
                name: independent_n1
                label: Sample Size (Group 1)
                format: number
              - type: TextBox
                name: independent_n2
                label: Sample Size (Group 2)
                format: number
              - type: TextBox
                name: independent_r1
                label: Correlation Coefficient (Group 1)
                format: number
              - type: TextBox
                name: independent_r2
                label: Correlation Coefficient (Group 2)
                format: number

      - type: Content
        name: dependent
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: TextBox
                name: dependent_n
                label: Sample Size
                format: number
              - type: TextBox
                name: dependent_r12
                label: Correlation Coefficient (r₁₂ — Var 1 vs Var 2)
                format: number
              - type: TextBox
                name: dependent_r13
                label: Correlation Coefficient (r₁₃ — Var 1 vs Var 3)
                format: number
              - type: TextBox
                name: dependent_r23
                label: Correlation Coefficient (r₂₃ — Var 2 vs Var 3)
                format: number

      - type: Content
        name: dep_nonoverlapping
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: TextBox
                name: dep_non_n
                label: Sample Size (N)
                format: number
              - type: TextBox
                name: dep_non_r12
                label: Correlation r₁₂ (Var 1 vs Var 2)
                format: number
              - type: TextBox
                name: dep_non_r34
                label: Correlation r₃₄ (Var 3 vs Var 4)
                format: number
              - type: TextBox
                name: dep_non_r13
                label: Intercorrelation r₁₃ (Var 1 vs Var 3)
                format: number
              - type: TextBox
                name: dep_non_r14
                label: Intercorrelation r₁₄ (Var 1 vs Var 4)
                format: number
              - type: TextBox
                name: dep_non_r23
                label: Intercorrelation r₂₃ (Var 2 vs Var 3)
                format: number
              - type: TextBox
                name: dep_non_r24
                label: Intercorrelation r₂₄ (Var 2 vs Var 4)
                format: number

      - type: Content
        name: multigroup
        children:
          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: "Variable X"
                children:
                  - type: VariablesListBox
                    name: multi_var_x
                    isTarget: true
                    maxItemCount: 1
              - type: TargetLayoutBox
                label: "Variable Y"
                children:
                  - type: VariablesListBox
                    name: multi_var_y
                    isTarget: true
                    maxItemCount: 1
              - type: TargetLayoutBox
                label: "Grouping Variable (k ≥ 2 Groups)"
                children:
                  - type: VariablesListBox
                    name: multi_group
                    isTarget: true
                    maxItemCount: 1

      - type: Content
        name: partial_comparison
        children:
          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: "Variable X"
                children:
                  - type: VariablesListBox
                    name: partial_var_x
                    isTarget: true
                    maxItemCount: 1
              - type: TargetLayoutBox
                label: "Variable Y"
                children:
                  - type: VariablesListBox
                    name: partial_var_y
                    isTarget: true
                    maxItemCount: 1
              - type: TargetLayoutBox
                label: "Control Variables / Covariates (Z)"
                children:
                  - type: VariablesListBox
                    name: partial_covs
                    isTarget: true
              - type: TargetLayoutBox
                label: "Grouping Variable (2 Groups)"
                children:
                  - type: VariablesListBox
                    name: partial_group
                    isTarget: true
                    maxItemCount: 1

      - type: Content
        name: jennrich
        children:
          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: Variables
                children:
                  - type: VariablesListBox
                    name: vars_jennrich
                    isTarget: true
              - type: TargetLayoutBox
                label: Grouping Variable (2 groups)
                children:
                  - type: VariablesListBox
                    name: group_jennrich
                    maxItemCount: 1
                    isTarget: true

  - type: CollapseBox
    label: Plots
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: CheckBox
            name: show_ci_plot
            label: Show Correlation Confidence Interval Plot
            enable: (mode == 'independent' || mode == 'dependent' || mode == 'dep_nonoverlapping')
          - type: CheckBox
            name: show_ellipse_plot
            label: Show Scatterplot with Overlapping Confidence Ellipses
            enable: (mode == 'multigroup' || mode == 'partial_comparison')
