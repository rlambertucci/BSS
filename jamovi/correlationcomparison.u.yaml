---
name: correlationComparison
title: Compare Correlations
jus: '3.0'
compilerMode: tame
children:
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    useSingleCell: true
    children:
      - type: ComboBox
        name: mode
        label: Analysis mode

  - type: LayoutBox
    margin: none
    stretchFactor: 1
    useSingleCell: true
    contentLink: (mode:independent)
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: independent_input_type
            label: "Data source"
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        useSingleCell: true
        contentLink: (independent_input_type:summary)
        children:
          - type: TextBox
            name: independent_n1
            label: "Sample size (group 1)"
            format: number
            enable: (independent_input_type:summary)
          - type: TextBox
            name: independent_n2
            label: "Sample size (group 2)"
            format: number
            enable: (independent_input_type:summary)
          - type: TextBox
            name: independent_r1
            label: "Correlation coefficient (group 1)"
            format: number
            enable: (independent_input_type:summary)
          - type: TextBox
            name: independent_r2
            label: "Correlation coefficient (group 2)"
            format: number
            enable: (independent_input_type:summary)
      - type: LayoutBox
        margin: none
        stretchFactor: 1
        useSingleCell: true
        contentLink: (independent_input_type:raw)
        children:
          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: "Variable X"
                children:
                  - type: VariablesListBox
                    name: indep_var_x
                    isTarget: true
                    maxItemCount: 1
              - type: TargetLayoutBox
                label: "Variable Y"
                children:
                  - type: VariablesListBox
                    name: indep_var_y
                    isTarget: true
                    maxItemCount: 1
              - type: TargetLayoutBox
                label: "Grouping Variable (2 Levels)"
                children:
                  - type: VariablesListBox
                    name: indep_group
                    isTarget: true
                    maxItemCount: 1

  - type: LayoutBox
    margin: none
    stretchFactor: 1
    useSingleCell: true
    contentLink: (mode:dependent)
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: TextBox
            name: dependent_n
            label: "Sample size"
            format: number
          - type: TextBox
            name: dependent_r12
            label: "Correlation coefficient (r₁₂ — var 1 vs var 2)"
            format: number
          - type: TextBox
            name: dependent_r13
            label: "Correlation coefficient (r₁₃ — var 1 vs var 3)"
            format: number
          - type: TextBox
            name: dependent_r23
            label: "Correlation coefficient (r₂₃ — var 2 vs var 3)"
            format: number

  - type: LayoutBox
    margin: none
    stretchFactor: 1
    useSingleCell: true
    contentLink: (mode:dep_nonoverlapping)
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: TextBox
            name: dep_non_n
            label: "Sample size (N)"
            format: number
          - type: TextBox
            name: dep_non_r12
            label: "Correlation r₁₂ (var 1 vs var 2)"
            format: number
          - type: TextBox
            name: dep_non_r34
            label: "Correlation r₃₄ (var 3 vs var 4)"
            format: number
          - type: TextBox
            name: dep_non_r13
            label: "Intercorrelation r₁₃ (var 1 vs var 3)"
            format: number
          - type: TextBox
            name: dep_non_r14
            label: "Intercorrelation r₁₄ (var 1 vs var 4)"
            format: number
          - type: TextBox
            name: dep_non_r23
            label: "Intercorrelation r₂₃ (var 2 vs var 3)"
            format: number
          - type: TextBox
            name: dep_non_r24
            label: "Intercorrelation r₂₄ (var 2 vs var 4)"
            format: number

  - type: LayoutBox
    margin: none
    stretchFactor: 1
    useSingleCell: true
    contentLink: (mode:multigroup)
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: "Variable X"
            children:
              - type: VariablesListBox
                name: multi_var_x
                isTarget: true
                maxItemCount: 1
          - type: TargetLayoutBox
            label: "Variable Y"
            children:
              - type: VariablesListBox
                name: multi_var_y
                isTarget: true
                maxItemCount: 1
          - type: TargetLayoutBox
            label: "Grouping Variable (k ≥ 2 Groups)"
            children:
              - type: VariablesListBox
                name: multi_group
                isTarget: true
                maxItemCount: 1

  - type: LayoutBox
    margin: none
    stretchFactor: 1
    useSingleCell: true
    contentLink: (mode:partial_comparison)
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: "Variable X"
            children:
              - type: VariablesListBox
                name: partial_var_x
                isTarget: true
                maxItemCount: 1
          - type: TargetLayoutBox
            label: "Variable Y"
            children:
              - type: VariablesListBox
                name: partial_var_y
                isTarget: true
                maxItemCount: 1
          - type: TargetLayoutBox
            label: "Control Variables / Covariates (Z)"
            children:
              - type: VariablesListBox
                name: partial_covs
                isTarget: true
          - type: TargetLayoutBox
            label: "Grouping Variable (2 Groups)"
            children:
              - type: VariablesListBox
                name: partial_group
                isTarget: true
                maxItemCount: 1

  - type: LayoutBox
    margin: none
    stretchFactor: 1
    useSingleCell: true
    contentLink: (mode:jennrich)
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Variables
            children:
              - type: VariablesListBox
                name: vars_jennrich
                isTarget: true
          - type: TargetLayoutBox
            label: Grouping Variable (2 groups)
            children:
              - type: VariablesListBox
                name: group_jennrich
                maxItemCount: 1
                isTarget: true

  - type: CollapseBox
    label: Plots
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: CheckBox
            name: show_ci_plot
            label: "Correlation confidence interval plot"
            enable: (mode:independent || mode:dependent || mode:dep_nonoverlapping)
          - type: CheckBox
            name: show_ellipse_plot
            label: "Scatterplot with confidence ellipses"
            enable: (mode:multigroup || mode:partial_comparison)
