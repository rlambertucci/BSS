---
name: effectSize
title: Effect Size
jus: '3.0'
compilerMode: tame
events:
  loaded: ./effectsize::updateReferences
  updated: ./effectsize::updateReferences

children:
  - type: ModeSelector
    name: mode
    stretchFactor: 1
    children:
      - type: Content
        name: cross_sectional
        children:
          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: Dependent Variables (DVs)
                children:
                  - type: VariablesListBox
                    name: dep_vars_cs
                    isTarget: true
              - type: TargetLayoutBox
                label: "Independent / Grouping Variables (IVs)"
                children:
                  - type: VariablesListBox
                    name: indep_vars_cs
                    events:
                      change: ./effectsize::updateReferences
                    isTarget: true
              - type: TargetLayoutBox
                label: "Covariate (Optional)"
                children:
                  - type: VariablesListBox
                    name: cov
                    maxItemCount: 1
                    isTarget: true
          - type: CollapseBox
            label: Effect Size Settings
            collapsed: false
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: es_method
                    label: "Effect size method"
                  - type: CheckBox
                    name: show_cles
                    label: "Common language effect size"
                  - type: ListBox
                    name: glass_references
                    label: Glass reference levels
                    enable: (es_method:glass_delta && !use_glm)
                    showColumnHeaders: true
                    fullRowSelect: true
                    height: normal
                    events:
                      change: ./effectsize::updateReferences
                    columns:
                      - name: variable
                        label: Independent variable
                        selectable: false
                        template:
                          type: VariableLabel
                      - name: reference
                        label: Reference level
                        selectable: false
                        template:
                          type: LevelSelector
                  
                  - type: Label
                    label: "GzLM — average marginal effect (AME)"
                    margin: large
                  - type: CheckBox
                    name: use_glm
                    label: "GzLM average marginal effect"
                  - type: ComboBox
                    name: es_glm
                    label: "GzLM distribution"
                    enable: (use_glm)

      - type: Content
        name: longitudinal
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: Label
                label: "Compare effect sizes across time points (paired samples)."
              - type: ComboBox
                name: long_format
                label: "Data format"

          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: Dependent Variables (for Long format)
                children:
                  - type: VariablesListBox
                    name: dep_vars_long
                    isTarget: true
                    enable: (long_format:long)
              
              
              - type: TargetLayoutBox
                label: Subject ID Variable
                children:
                  - type: VariablesListBox
                    name: subject_id_var
                    isTarget: true
                    maxItemCount: 1
              
              - type: TargetLayoutBox
                label: "Time / Wave Variable (for Long format)"
                children:
                  - type: VariablesListBox
                    name: time_var
                    isTarget: true
                    maxItemCount: 1
                    enable: (long_format:long)
              
              - type: TargetLayoutBox
                label: "Wave Columns (for Wide format)"
                children:
                  - type: VariablesListBox
                    name: wave_vars
                    isTarget: true
                    enable: (long_format:wide)

          - type: CollapseBox
            label: Longitudinal Effect Size Settings
            collapsed: false
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: es_method_long
                    label: "Effect size method (longitudinal)"
                  - type: CheckBox
                    name: show_cles_long
                    label: "Common language effect size (paired)"
                  - type: TextBox
                    name: reference_group_long
                    label: "Reference wave (empty = first in pair)"
                    format: string
                    enable: (es_method_long:glass_dz)

  - type: VariableSupplier
    name: categorical_variables
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: "Categorical Factor 1 (Row / Exposure)"
        children:
          - type: VariablesListBox
            name: cat_var1
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: "Categorical Factor 2 (Column / Outcome)"
        children:
          - type: VariablesListBox
            name: cat_var2
            isTarget: true
            maxItemCount: 1


  - type: CollapseBox
    label: "Direct Calculator From Test Statistics (t, F, z, χ²)"
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: calc_from_test_stat
            label: "Direct test statistic calculator"
          - type: ComboBox
            name: stat_type
            label: "Test statistic type"
            enable: (calc_from_test_stat)
          - type: TextBox
            name: stat_val
            label: "Statistic value"
            format: number
            enable: (calc_from_test_stat)
          - type: TextBox
            name: stat_df1
            label: "Degrees of freedom (numerator for F)"
            format: number
            enable: (calc_from_test_stat && (stat_type:stat_t || stat_type:stat_f))
          - type: TextBox
            name: stat_df2
            label: "Denominator degrees of freedom (F)"
            format: number
            enable: (calc_from_test_stat && stat_type:stat_f)
          - type: TextBox
            name: stat_rows
            label: "Contingency table rows"
            format: number
            enable: (calc_from_test_stat && stat_type:stat_chisq)
          - type: TextBox
            name: stat_cols
            label: "Contingency table columns"
            format: number
            enable: (calc_from_test_stat && stat_type:stat_chisq)
          - type: TextBox
            name: stat_n
            label: "Sample size N (z and chi-square)"
            format: number
            enable: (calc_from_test_stat && (stat_type:stat_z || stat_type:stat_chisq))

  - type: CollapseBox
    label: Confidence Intervals
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: ci_method
            label: "CI method"
          - type: ComboBox
            name: ci_level
            label: "Confidence level"
          - type: TextBox
            name: n_bootstrap
            label: "Number of bootstrap samples"
            format: number
            enable: (ci_method:bootstrap)

  - type: CollapseBox
    label: Conversions, Interpretation & Forest Plot
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: benchmark_standard
            label: "Interpretation benchmark"
          - type: CheckBox
            name: show_conversions
            enable: (mode:cross_sectional && es_method:cohens_d && !use_glm && !cov)
            label: "Effect size conversions (d, r, η², OR, AUC)"
          - type: CheckBox
            name: show_es_plot
            label: "Effect size forest plot"
          - type: TextBox
            name: plot_width
            label: "Plot width"
            format: number
            enable: (show_es_plot)
          - type: TextBox
            name: plot_height
            label: "Plot height"
            format: number
            enable: (show_es_plot)

  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: include_interactions
        enable: (mode:cross_sectional && (!es_method:glass_delta || use_glm))
        label: "Interactions between independent variables"
      - type: CheckBox
        name: run_analysis
        label: "Effect size results"
