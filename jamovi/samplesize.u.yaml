---
title: "Sample Size Calculation"
name: samplesize
jus: '3.0'
compilerMode: tame
children:
  - type: ModeSelector
    name: mode
    children:
      - type: Content
        name: finite
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: ComboBox
                name: method_finite

          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: TextBox
                name: population_size_finite
                label: "Population size (N)"
                format: number
              - type: TextBox
                name: confidence_level_finite
                enable: (method_finite:Cochran)
                label: "Confidence level (%)"
                format: number
              - type: TextBox
                name: margin_error_finite
                label: "Margin of error (%)"
                format: number

          - type: CollapseBox
            label: Cochran Additional Parameter
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: TextBox
                    name: population_proportion_finite
                    enable: (method_finite:Cochran)
                    label: "Population proportion (p)"
                    format: number

      - type: Content
        name: animals
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: design_animals
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: nGroups_animals
                enable: ({ return ui['design_animals'].value() !== 'Design 2 (Repeated Measures)'; })
                format: number
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: nMeasures_animals
                enable: ({ return ui['design_animals'].value() !== 'Design 1 (One-way ANOVA)'; })
                format: number
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: sacrifice_animals
                enable: ({ return ui['design_animals'].value() !== 'Design 1 (One-way ANOVA)'; })

          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: dropout_animals
                label: "Expected attrition / dropout rate (%)"
                format: number
          - type: CollapseBox
            label: "Power-Based ANOVA Settings (Optional Comparison)"
            collapsed: true
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: CheckBox
                    name: calc_power_anova_animals
                    enable: ({ return ui['design_animals'].value() !== 'Design 2 (Repeated Measures)'; })
                    label: "Power-based ANOVA sample size comparison"
                  - type: TextBox
                    name: power_f_animals
                    label: "Effect size (Cohen's f)"
                    format: number
                    enable: ({ return ui['calc_power_anova_animals'].value() && ui['design_animals'].value() !== 'Design 2 (Repeated Measures)'; })
                  - type: TextBox
                    name: power_alpha_animals
                    label: "Significance level (α)"
                    format: number
                    enable: ({ return ui['calc_power_anova_animals'].value() && ui['design_animals'].value() !== 'Design 2 (Repeated Measures)'; })
                  - type: TextBox
                    name: power_target_animals
                    label: "Target power (1 - β)"
                    format: number
                    enable: ({ return ui['calc_power_anova_animals'].value() && ui['design_animals'].value() !== 'Design 2 (Repeated Measures)'; })
      - type: Content
        name: power_t
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: ComboBox
                name: t_test_type
              - type: TextBox
                name: t_effect_size
                format: number
              - type: TextBox
                name: t_alpha
                format: number
              - type: TextBox
                name: t_power
                format: number
              - type: ComboBox
                name: t_alternative
          - type: CollapseBox
            label: Power Sensitivity Curves
            collapsed: false
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                stretchFactor: 1
                children:
                  - type: CheckBox
                    name: show_power_curve
                  - type: TextBox
                    name: curve_n_max
                    enable: (show_power_curve)
                    format: number

      - type: Content
        name: tost
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: ComboBox
                name: tost_type
              - type: TextBox
                name: tost_eq_bound
                format: number
              - type: TextBox
                name: tost_true_diff
                format: number
              - type: TextBox
                name: tost_alpha
                format: number
              - type: TextBox
                name: tost_power
                format: number

      - type: Content
        name: proportions
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: ComboBox
                name: prop_test_type
              - type: TextBox
                name: prop_p1
                enable: (prop_test_type:two_prop || prop_test_type:one_prop)
                format: number
              - type: TextBox
                name: prop_p2
                enable: (prop_test_type:two_prop)
                format: number
              - type: TextBox
                name: prop_p0
                enable: (prop_test_type:one_prop)
                format: number
              - type: TextBox
                name: prop_p12
                enable: (prop_test_type:mcnemar)
                format: number
              - type: TextBox
                name: prop_p21
                enable: (prop_test_type:mcnemar)
                format: number
              - type: TextBox
                name: prop_alpha
                format: number
              - type: TextBox
                name: prop_power
                format: number
              - type: ComboBox
                name: prop_alternative
...
